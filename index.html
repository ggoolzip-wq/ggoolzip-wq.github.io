<style>
:root{
  --bg:#fbf6f0;--panel:#ffffff;--panel2:#fff8f0;--text:#2b2118;--muted:#8a7765;--line:#eadfd2;
  --accent:#f28c28;--accent2:#e0701a;--accent-soft:#fff0e0;--ok:#2fa36b;--warn:#d9534f;
  --shadow:0 2px 10px rgba(120,70,20,.08);--r:14px;
}
[data-theme="dark"]{
  --bg:#17130f;--panel:#221c17;--panel2:#2a221b;--text:#f3e9df;--muted:#a8978a;--line:#3a3028;
  --accent:#ff9a3c;--accent2:#ffb066;--accent-soft:#3a2a1a;--shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--shadow)}
.hwrap{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-weight:800;font-size:1.15rem;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.logo .leaf{width:26px;height:26px}
.hspace{flex:1}
.hbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.3)}
nav.tabs{max-width:1200px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto}
nav.tabs button{background:none;border:none;color:rgba(255,255,255,.85);padding:8px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:600}
nav.tabs button.on{color:#fff;border-bottom-color:#fff}
main{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:270px 1fr;gap:16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.card h2{margin:0 0 10px;font-size:1.02rem;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:.86rem}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{padding:4px 8px;font-size:.82rem;border-radius:8px}
.btn.danger{background:var(--warn)}
.btn.plain{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.chars{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.char{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.char.on{border-color:var(--accent);background:var(--accent-soft)}
.char .nm{font-weight:700}
.char .meta{font-size:.8rem;color:var(--muted)}
.char .grow{flex:1;min-width:0}
.char .rev{font-size:.8rem;color:var(--accent);font-weight:700;white-space:nowrap}
.empty{text-align:center;padding:36px 16px}
.empty .big{font-size:2.6rem}
.grid{display:grid;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{font-size:.8rem;color:var(--muted)}
.stat .v{font-size:1.2rem;font-weight:800;margin-top:2px}
.stat .v.acc{color:var(--accent)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--warn)}
.sec-title{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-weight:800}
.pill{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.boss-list{display:flex;flex-direction:column;gap:6px}
.boss{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.boss.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel2))}
.boss .bn{font-weight:700}
.boss .grow{flex:1;min-width:0}
.diffs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.diff{font-size:.78rem;padding:3px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;user-select:none}
.diff.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.diff.locked{opacity:.4;cursor:not-allowed}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;background:var(--panel);flex:none;font-weight:900;color:#fff}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.dis{opacity:.35;cursor:not-allowed}
.party{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted)}
.party select{padding:3px 4px;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
.price{font-size:.8rem;color:var(--muted);white-space:nowrap;text-align:right;min-width:86px}
.price b{color:var(--text)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--panel);border:none;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:.8rem}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=number],select.in{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
input.pin{width:150px;text-align:right;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.note{background:var(--accent-soft);border-left:4px solid var(--accent);padding:8px 12px;border-radius:8px;font-size:.85rem}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border-radius:16px;padding:18px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{margin:0 0 12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2b2118;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.hidden{display:none!important}
.chart svg{width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px}
.chart .lbl{fill:var(--text);font-weight:700}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
.side-sticky{position:sticky;top:96px;align-self:start}
@media(max-width:820px){.side-sticky{position:static}}
.foot{max-width:1200px;margin:0 auto;padding:4px 16px 24px;color:var(--muted);font-size:.78rem}
.avatar{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);flex:none;display:grid;place-items:center;overflow:hidden;font-weight:800;color:var(--accent)}
.avatar img{width:64px;height:64px;object-fit:none;object-position:center 60%;image-rendering:auto}
.avatar.lg{width:64px;height:64px;border-radius:14px}
.avatar.lg img{width:96px;height:96px}
.mainbadge{font-size:.68rem;background:var(--accent);color:#fff;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.world-h{font-size:.76rem;color:var(--muted);font-weight:700;margin:8px 2px 0}
.pill.api{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.err{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.apibox{display:flex;flex-direction:column;gap:6px}
.apibox .btn{width:100%}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.keyrow{display:flex;gap:6px}
.keyrow input{flex:1}
.imp-list{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:4px;margin:8px 0}
.imp-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer}
.imp-item.dis{opacity:.5;cursor:default}
.imp-item input{width:18px;height:18px;accent-color:var(--accent)}
.modal.wide{max-width:520px}
.checkline{display:flex;align-items:center;gap:8px;font-size:.9rem}
.checkline input{width:18px;height:18px;accent-color:var(--accent)}
code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:.85em}
.char .grow .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{grid-template-columns:300px 1fr}
@media(max-width:820px){main{grid-template-columns:1fr}}
.bicon{width:28px;height:28px;border-radius:8px;object-fit:cover;flex:none;display:inline-grid;place-items:center;vertical-align:middle;margin-right:8px;box-shadow:0 0 0 1px var(--line)}
.bicon.fb{background:linear-gradient(135deg,hsl(var(--h) 55% 55%),hsl(calc(var(--h) + 40) 55% 40%));color:#fff;font-weight:800;font-size:.85rem;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.boss .bn{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.boss .bn .bicon{width:34px;height:34px;margin-right:6px}
.bname{display:inline-flex;align-items:center;gap:2px}
.bname .bicon{width:24px;height:24px;border-radius:6px}
.drag-h{cursor:grab;color:var(--muted);font-size:1rem;line-height:1;padding:4px 2px;user-select:none;touch-action:none;flex:none}
.char{position:relative}
.char.dragging,.world-h.dragging{opacity:.4}
.drop-before{box-shadow:inset 0 3px 0 var(--accent)!important}
.drop-after{box-shadow:inset 0 -3px 0 var(--accent)!important}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none}
.ordcol{display:flex;flex-direction:column;gap:2px}
.ord{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:5px;font-size:.55rem;line-height:1;padding:2px 4px;cursor:pointer}
.ord:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.ord:disabled{opacity:.3;cursor:default}
.world-h{display:flex;align-items:center;gap:4px;padding:2px 0;border-radius:6px}
.world-h .ord{font-size:.5rem}
.accb{display:inline-block;font-size:.66rem;font-weight:700;padding:0 5px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);vertical-align:1px}
.accb.warn{color:var(--warn);border-color:var(--warn)}
.acc-row{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:8px}
.acc-line{display:flex;gap:6px;align-items:center;font-size:.8rem}

/* EXP 표시 (사이드바 카드, 아주 작게) */
.char .nm{line-height:1.2}
.char .meta{line-height:1.25}
.expl{display:flex;align-items:center;gap:5px;height:9px;margin-top:2px}
.expbar{flex:1;max-width:120px;height:3px;border-radius:2px;background:rgba(127,127,127,.22);overflow:hidden}
.expbar>i{display:block;height:100%;background:#9BE84A;border-radius:2px;box-shadow:0 0 4px rgba(155,232,74,.55)}
.exppct{font-size:.62rem;line-height:9px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 보스 체크 탭: 본문 + 오른쪽 수익 패널 */
main{max-width:1480px}
.bosslay{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,max-content);gap:16px;align-items:start}
.rcol{position:sticky;top:110px;display:flex;flex-direction:column;gap:12px;height:calc(100vh - 172px);max-height:calc(100vh - 172px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.rcol>.card{margin:0}

/* ---- 일퀘 현황 ---- */
.dqtop{margin-bottom:12px}
.dqtop h2{flex-wrap:wrap;margin:0}
.dqstat{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.dqspin{width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sbspin .8s linear infinite}
.dqedit{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.dqchips{display:flex;flex-wrap:wrap;gap:6px}
.dqchip{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700;cursor:pointer;text-decoration:line-through}
.dqchip.on{color:var(--text);text-decoration:none;border-color:var(--c);box-shadow:inset 3px 0 0 var(--c)}
.dqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.dqc{padding:12px}
.dqc.hid{opacity:.45}
.dqh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.dqh .avatar{width:36px;height:36px}
.dqh .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dqh .meta{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dqh .grow{flex:1;min-width:0}
.dqcnt{font-size:.78rem;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.dqcnt.full{background:var(--ok);border-color:var(--ok);color:#fff}
.dqeye{padding:3px 8px;font-size:.78rem}
.dqcells{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.dqi{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:7px 8px 6px 11px;min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.dqi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.dqn{font-size:.82rem;font-weight:800;word-break:keep-all;overflow-wrap:anywhere;line-height:1.2}
.dqs{font-size:.72rem;color:var(--muted);white-space:nowrap;line-height:1.2}
.dqs em{font-style:normal;font-weight:700}
.dqi.s-prog .dqs{color:var(--accent);font-weight:700}
.dqi.s-done .dqs{color:var(--ok);font-weight:700}
.dqi.s-none{opacity:.55}
.dqi.off{opacity:.4;border-style:dashed}
.dqi.off .dqn{text-decoration:line-through}
.dqi[data-dqc]{cursor:pointer}
.dqi[data-dqc]:hover{border-color:var(--accent)}
/* 완료 덮개: 주간 보스 완료 덮개와 같은 처리 (rgba 0,0,0,.55 · 마우스를 올리면 사라짐 · 클릭 통과) */
.dqov{position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:#fff;font-weight:800;font-size:.8rem;line-height:1.2;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;opacity:1;transition:opacity .15s ease;z-index:2;padding:2px 4px}
.dqov-n{font-size:.78rem;word-break:keep-all}
.dqov-t{font-size:.72rem}
.dqov-t b{color:#7dffb0}
/* 덮개가 있을 때는 원래 글자를 숨겨 겹치지 않게 (마우스를 올리면 덮개가 사라지고 원래 칸이 보임) */
.dqi.s-done>.dqn,.dqi.s-done>.dqs{opacity:0;transition:opacity .15s ease}
@media(hover:hover){.dqi:hover .dqov{opacity:0}.dqi.s-done:hover>.dqn,.dqi.s-done:hover>.dqs{opacity:1}}
.dqlock{font-size:.74rem;margin-top:8px}
.dqmsg{font-size:.84rem;padding:6px 2px}
.dqfoot{margin:10px 2px 0}
@media(max-width:520px){.dqgrid{grid-template-columns:1fr}.dqcells{grid-template-columns:repeat(3,minmax(0,1fr))}.dqtop h2 .dqstat{order:5;width:100%}}
/* ---- 길드 현황 ---- */
.gcard h2{flex-wrap:wrap}
.gmeta{display:flex;align-items:center;gap:10px;font-size:.88rem;margin-bottom:10px}
.glv{background:var(--accent);color:#fff;font-weight:800;border-radius:8px;padding:2px 8px;font-size:.8rem}
.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gtile{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px 14px}
.gk{font-size:.82rem;color:var(--muted);font-weight:700}
.gv{font-size:1.45rem;font-weight:900;margin-top:4px;letter-spacing:-.01em}
.gv small{font-size:.8rem;font-weight:700;color:var(--muted);margin-left:2px}
.gv.dim{font-size:1rem;color:var(--muted)}
.grk{font-size:.86rem;margin-top:2px}
.grk b{color:var(--accent);font-size:1.05rem}
.grow-r{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.grow-r:last-of-type{border-bottom:0}
.grow-r .grow{flex:1;min-width:0}
.grow-r .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow-r .meta{font-size:.78rem;color:var(--muted)}
.gsc{display:flex;flex-direction:column;align-items:flex-end;min-width:64px}
.gsc b{font-size:.95rem;white-space:nowrap}
.gsc b small{font-size:.72rem;color:var(--muted);font-weight:600}
.gsc.main b{font-size:1.15rem;color:var(--accent)}
@media(max-width:520px){.gv{font-size:1.2rem}.grow-r{flex-wrap:wrap}.grow-r .grow{flex-basis:calc(100% - 50px)}.gsc{min-width:0;flex:1;align-items:flex-start}}
/* 일퀘 칸 지역 아이콘 (이름 왼쪽 20px, 덮개 안에서는 살짝 어둡게) */
.dqn{display:flex;align-items:center;gap:4px;min-width:0}
.dqn>span{min-width:0}
.dqico{width:20px;height:20px;object-fit:contain;flex:none;image-rendering:auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.dqov-n{display:inline-flex;align-items:center;gap:4px}
.dqov-n .dqico.ov{width:18px;height:18px;opacity:.85}
.dqi{padding-left:9px}
@media(max-width:520px){.dqico{width:18px;height:18px}.dqn{gap:3px}}
/* 일퀘 칸: 모든 상태에서 아이콘+지역명·상태 줄 가운데 정렬 (완료 덮개와 같은 정렬) */
.dqi{align-items:center;text-align:center;padding:7px 6px 6px 9px}
.dqn{justify-content:center;max-width:100%}
.dqs{text-align:center}

/* 소식 피드 카드 (왼쪽 아래) — 높이는 JS(feedFit)가 남은 화면 높이로 맞춤, 안쪽 스크롤 없음 */
.feedcard{display:flex;flex-direction:column;padding:10px 10px 8px;overflow:hidden;min-height:0}
.ftabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex:none}
.ftab{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:3px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font:inherit;font-size:.8rem;font-weight:600;padding:5px 3px 6px;cursor:pointer;white-space:nowrap}
.ftab:hover{color:var(--text)}
.ftab.on{color:var(--accent);border-bottom-color:var(--accent)}
.fcnt{min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--warn);color:#fff;font-size:.64rem;line-height:15px;font-weight:700;box-sizing:border-box;text-align:center}
.fnote{flex:none;font-size:.72rem;color:var(--muted);padding:4px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help}
.fbody{flex:1 1 auto;min-height:0;overflow:hidden;padding-top:3px}
.flist{list-style:none;margin:0;padding:0}
.flist li{height:31px}
.fit{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px;border-radius:8px;color:var(--text);text-decoration:none;font-size:.84rem}
.fit:hover{background:var(--panel2)}
.ftt{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fdt{flex:none;color:var(--muted);font-size:.74rem;font-variant-numeric:tabular-nums}
.fend{flex:none;color:var(--accent);font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}
.fnew{flex:none;width:15px;height:15px;border-radius:4px;background:var(--warn);color:#fff;font-size:.62rem;font-weight:800;line-height:15px;text-align:center}
.fit.exp{opacity:.45}
.fit.exp .fend{color:var(--muted);font-weight:600;text-decoration:line-through}
.fempty{color:var(--muted);font-size:.82rem;padding:10px 4px}
.fpager{flex:none;display:flex;justify-content:center;gap:3px;min-height:26px;align-items:center;padding-top:4px}
.fpg{min-width:24px;height:22px;padding:0 5px;border-radius:6px;border:1px solid transparent;background:none;color:var(--muted);font:inherit;font-size:.76rem;cursor:pointer;font-variant-numeric:tabular-nums}
.fpg:hover:not(:disabled){color:var(--text);border-color:var(--line)}
.fpg.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.fpg:disabled{opacity:.35;cursor:default}
/* 썬데이 메이플 카드 (소식 카드 아래) — 높이는 feedFit 이 소식 카드와 1:2 로 나눔 */
.stab{cursor:default}
.stab:hover{color:var(--accent)}
.sunico{width:15px;height:15px;flex:none;color:#f5c518;filter:drop-shadow(0 0 2px rgba(245,197,24,.45))}
.sunbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:4px;padding-top:6px}
.sunimg{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden;background:linear-gradient(180deg,rgba(245,197,24,.10),rgba(245,197,24,.03));border:0;padding:0;cursor:zoom-in;width:100%}
.sunimg img{width:100%;height:100%;object-fit:contain;display:block}
.sunimg:hover,.sunimg:focus-visible{outline:2px solid rgba(245,197,24,.6);outline-offset:-2px}
.suncap{flex:none;display:flex;gap:6px;align-items:center;font-size:.76rem;color:var(--muted);padding:0 2px}
.suncap .ftt{color:var(--text);font-weight:600}
.suncard.tight .suncap{display:none}
.sunben{flex:none;display:flex;gap:6px;align-items:flex-start;font-size:.78rem;padding:5px 8px;border-radius:8px;background:rgba(245,197,24,.14);color:var(--text);min-width:0}
.sunben b{flex:none;color:#d9a400;font-size:.7rem;font-weight:800;line-height:1.45}
.sunben ul{list-style:none;margin:0;padding:0;min-width:0;flex:1 1 auto}
.sunben li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;line-height:1.45}
.sunlb{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.sunlb-in{position:relative;display:flex;flex-direction:column;max-width:min(94vw,900px);max-height:calc(100vh - 32px);background:var(--panel,#1c1c1f);border-radius:12px;padding:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.sunlb-sc{flex:1 1 auto;min-height:0;overflow:auto;display:flex;justify-content:center;border-radius:8px}
.sunlb-sc img{display:block;max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;cursor:zoom-in}
.sunlb.zoom .sunlb-sc{align-items:flex-start}
.sunlb.zoom .sunlb-sc img{max-height:none;width:min(876px,100%);cursor:zoom-out}
.sunlb-x{position:absolute;top:-12px;right:-12px;width:34px;height:34px;border-radius:50%;border:none;background:#f5c518;color:#222;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:1}
.sunlb-bar{flex:none;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 4px 0;font-size:.82rem;color:var(--text,#eee)}
.sunlb-t{display:inline-flex;gap:6px;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.sunlb-t small{color:var(--muted);font-weight:500}
.sunlb-bar a{flex:none;color:var(--accent);font-weight:700;text-decoration:none}
.sunlb-bar a:hover{text-decoration:underline}
html.sunlb-open{overflow:hidden}
@media(max-width:600px){.sunlb{padding:8px}.sunlb-in{max-width:100%;max-height:calc(100vh - 16px);padding:8px}.sunlb-x{top:4px;right:4px}.sunlb-sc img{max-height:calc(100vh - 80px)}}
.sunempty{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:.8rem;text-align:center;border:1px dashed var(--line);border-radius:8px;min-height:80px}
.sunempty .sunico{width:30px;height:30px;opacity:.75}
@media(max-width:820px){
  #sunCard{order:3}
  #sunCard .sunimg{height:min(70vh,520px);flex:none}
  /* 모바일: 피드는 본문 아래로 자연스럽게 */
  .side-sticky{display:contents}
  .side-sticky>.card{margin-top:0!important}
  #feedCard{order:2}
}

/* 이번 주 보스를 아직 안 잡은 캐릭터: 예상 주간 수익 (강렬한 힘의 결정 아이콘) */
.expinc{display:inline-flex;align-items:center;gap:3px;margin-left:4px;padding:0 7px 0 3px;border-radius:999px;border:1px solid var(--line);background:var(--accent-soft);color:var(--text);font-size:.8rem;white-space:nowrap;vertical-align:middle}
.expinc .ric{width:18px;height:18px}
.expinc b{color:var(--accent)}
.expinc small{color:var(--muted);font-size:.7rem}

/* 오른쪽 열: 수익 · 결정석 가격 · 초기화까지(맨 아래). 화면 높이 안에 맞추고 넘치면 가격 목록(그다음 수익 패널)이 안에서 스크롤 → 초기화 카드는 항상 보임 */
/* 오른쪽 열 = 화면 높이 고정(sticky, 100vh − 위 108px − 아래 안내문/여백 58px − 6px → 내용이 짧아도 페이지 스크롤 안 생김): 수익 패널(위) · 결정석 가격(남는 높이 전부, 안에서 스크롤) · 초기화까지(맨 아래).
 * 결정석 가격 목록이 약 16줄(카드 ≈ 440px)을 먼저 확보하도록 수익 패널 최대 높이 = 남은 높이 − 440px − 초기화 카드·간격(≈124px), 최소 170px → 1920x1080 17줄, 1280x800 11줄 (2026-10-10 사용자 요청: 가격 카드가 2줄만 보이던 것) */
.rcol>.revpanel{flex:0 0 auto;max-height:max(170px,calc(100vh - 172px - 564px));overflow-y:auto;scrollbar-width:thin}
.rcol>.pricecard{flex:1 1 0;min-height:110px;display:flex;flex-direction:column}
.rcol>.pricecard .pc-list{flex:1 1 auto;min-height:40px;max-height:none}
.rcol>.resetcard{flex:none;margin-top:auto;padding:10px 14px;font-size:.82rem;line-height:1.5}
@media(max-width:1180px){.rcol>.revpanel,.rcol>.pricecard{overflow:visible;max-height:none;flex:none}.rcol>.pricecard .pc-list{max-height:260px}}
/* 캐릭터 목록: 8명 넘으면 목록 안에서 스크롤 (fitCharList 가 max-height 지정) */
#charList.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:2px}
#charList.sorted .char .drag-h{visibility:hidden}
.charsort{display:inline-flex;gap:8px;margin-left:auto;padding-left:8px;white-space:nowrap}
.sortlink{all:unset;cursor:pointer;font-size:.74rem;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.sortlink.on{font-weight:800;color:var(--text);text-decoration-thickness:2px}
.sortlink:hover{color:#c95a00}
[data-theme="dark"] .sortlink:hover{color:#ff9a3c}
.sortlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
/* 월드 탭 (캐릭터 카드): 밑줄 글자 탭 'ㅣ' 구분, 활성 = 굵은 주황(다크) / 진한 주황(라이트), 마우스 올리면 주황 */
.wtabs{display:flex;align-items:center;flex-wrap:wrap;row-gap:2px;margin:2px 0 6px;font-size:.84rem}
.wtabs:empty{display:none}
.wtablist{display:inline-flex;align-items:center;flex-wrap:wrap;min-width:0}
.wtab{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:3px;padding:2px 3px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;white-space:nowrap;border-radius:4px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-user-drag:element}
.wtab .cnt{font-weight:500}
.wtab:hover{color:#c95a00}
.wtab.on{color:#c95a00;font-weight:800;text-decoration-thickness:2px}
[data-theme="dark"] .wtab:hover,[data-theme="dark"] .wtab.on{color:#ff9a3c}
.wtab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wtab .wico{width:14px;height:14px;image-rendering:pixelated;flex:none;text-decoration:none}
.wdiv{color:var(--muted);opacity:.55;padding:0 3px;user-select:none}
.wtab.dragging{opacity:.4}
.wtab.drop-before{box-shadow:-2px 0 0 var(--accent)}
.wtab.drop-after{box-shadow:2px 0 0 var(--accent)}

/* 드롭 칩 툴팁 (2026-10-10, 마우스 올림 + 터치) */
#mbtTip{position:fixed;z-index:9999;max-width:min(340px,calc(100vw - 16px));padding:8px 10px;border-radius:8px;background:#15171c;color:#eef0f4;border:1px solid #3a3f4a;box-shadow:0 6px 18px rgba(0,0,0,.45);font-size:.75rem;line-height:1.45;white-space:pre-line;pointer-events:none;opacity:0;transition:opacity .1s;left:-9999px;top:0}
#mbtTip.show{opacity:1}
#mbtTip .tth{font-weight:700;color:#fff}
.drop.eter{background:color-mix(in srgb,#b58cff 8%,var(--panel))}
.drop.eter .ecnt{background:#7d5bd6}

/* ---- 캐릭터 카드 제목 옆 🔄 동기화 아이콘 버튼 (2026-10-10: 헤더에서 이동, 글자 없이 아이콘만) ---- */
h2.charh{display:flex;align-items:center;gap:6px}
.ibtn.sbtn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border-radius:50%;border:1px solid var(--line);
  background:var(--panel2);color:var(--muted);cursor:pointer;flex:none;transition:color .15s,border-color .15s}
.ibtn.sbtn:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.ibtn.sbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ibtn.sbtn:disabled{cursor:default;color:var(--accent)}
.ibtn.sbtn .rot{display:block;width:14px;height:14px}
.ibtn.sbtn.busy .rot{animation:sbspin .9s linear infinite}
.ibtn[hidden]{display:none!important}
@media(max-width:820px){.ibtn.sbtn{width:32px;height:32px}.ibtn.sbtn .rot{width:16px;height:16px}}

/* 서버 모드 입장 화면: 빈 화면 + 가운데 상자 (초대 비밀번호 → 대표 키) */
html.gated body>*:not(#svGate):not(#toast){visibility:hidden}
#svGate{position:fixed;inset:0;z-index:9999;background:#121216;display:flex;align-items:center;justify-content:center;padding:16px 16px 48px;color:#ececf1}
#svGate .svgbox{width:min(380px,100%);max-height:calc(100vh - 72px);overflow:auto;background:#1d1d23;border:1px solid #2e2e38;border-radius:16px;padding:24px;box-shadow:0 12px 48px rgba(0,0,0,.5)}
#svGate .svgt{font-weight:800;font-size:1.2rem;margin-bottom:10px}
#svGate .svgd{font-size:.85rem;line-height:1.5;margin-bottom:14px}
#svGate .svgd .muted{color:#9a9aa8;font-size:.78rem}
#svGate .svgr{display:flex;gap:6px}
#svGate .svgr input{flex:1;min-width:0;text-align:left;background:#121216;color:#ececf1;border:1px solid #3a3a46}
#svGate .svghelp{margin-top:14px;font-size:.78rem;color:#c8c8d2}
#svGate .svghelp summary{cursor:pointer;color:#ffb36b}
#svGate .svghelp ol{margin:8px 0 6px 18px;padding:0;line-height:1.6}
#svGate .svghelp a{color:#ffb36b}

.spk::before,.spk::after{content:"";position:absolute;inset:-3px -4px;pointer-events:none;background-color:currentColor;opacity:0;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%2010'%3E%3Cpath%20d='M5%200%206.1%203.9%2010%205%206.1%206.1%205%2010%203.9%206.1%200%205%203.9%203.9z'/%3E%3C/svg%3E"),url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%2010'%3E%3Cpath%20d='M5%200%206.1%203.9%2010%205%206.1%206.1%205%2010%203.9%206.1%200%205%203.9%203.9z'/%3E%3C/svg%3E"),url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%2010'%3E%3Cpath%20d='M5%200%206.1%203.9%2010%205%206.1%206.1%205%2010%203.9%206.1%200%205%203.9%203.9z'/%3E%3C/svg%3E"),url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%2010'%3E%3Cpath%20d='M5%200%206.1%203.9%2010%205%206.1%206.1%205%2010%203.9%206.1%200%205%203.9%203.9z'/%3E%3C/svg%3E");mask-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%2010'%3E%3Cpath%20d='M5%200%206.1%203.9%2010%205%206.1%206.1%205%2010%203.9%206.1%200%205%203.9%203.9z'/%3E%3C/svg%3E"),url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%2010'%3E%3Cpath%20d='M5%200%206.1%203.9%2010%205%206.1%206.1%205%2010%203.9%206.1%200%205%203.9%203.9z'/%3E%3C/svg%3E"),url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%2010'%3E%3Cpath%20d='M5%200%206.1%203.9%2010%205%206.1%206.1%205%2010%203.9%206.1%200%205%203.9%203.9z'/%3E%3C/svg%3E"),url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2010%2010'%3E%3Cpath%20d='M5%200%206.1%203.9%2010%205%206.1%206.1%205%2010%203.9%206.1%200%205%203.9%203.9z'/%3E%3C/svg%3E")}
.spk::before{-webkit-mask-size:6px 6px,5px 5px,4px 4px,5px 5px;mask-size:6px 6px,5px 5px,4px 4px,5px 5px;-webkit-mask-position:6% 12%,52% 88%,92% 30%,38% 10%;mask-position:6% 12%,52% 88%,92% 30%,38% 10%;animation:spkd1 2.2s ease-in-out infinite}
.spk::after{-webkit-mask-size:5px 5px,6px 6px,4px 4px,4px 4px;mask-size:5px 5px,6px 6px,4px 4px,4px 4px;-webkit-mask-position:28% 80%,70% 8%,96% 85%,14% 45%;mask-position:28% 80%,70% 8%,96% 85%,14% 45%;animation:spkd2 2.6s ease-in-out infinite;animation-delay:1s}
@keyframes spkd1{0%,100%{opacity:0}50%{opacity:.65}}
@keyframes spkd2{0%,100%{opacity:0}45%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.spk::before,.spk::after{animation:none;opacity:.35}}
/* 1~3위 아이템 글자색 */

/* b54: 에픽빔 누적 횟수 숫자 — 미니 스포트라이트(작은 빛이 숫자 위를 훑음, 글자 모양 안에서만) */
.epgold{background:radial-gradient(ellipse 50% 90% at 50% 50%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%) -60% 0/42% 100% no-repeat,linear-gradient(100deg,#b8860b,#ffd54a 30%,#fff6c2 45%,#ffd54a 60%,#b8860b) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;animation:epgs 2.8s linear infinite}
@keyframes epgs{from{background-position:-60% 0,0 0}to{background-position:160% 0,-250% 0}}
@media (prefers-reduced-motion:reduce){.epgold{animation:none;background-position:-60% 0,0 0}}

/* b55: 스포트라이트 — 글자 모양 안에서만 빛이 훑음 (글자색 유지: 맨 아래 레이어 = currentColor). 1위 빠르고 강 · 2위 중간 속도/약간 약 · 3위 중간/더 약 · (익스트림) 중간/중간 */
tr.rk1{--spd:2.2s;--spa:.9}tr.rk2{--spd:3.2s;--spa:.7}tr.rk3{--spd:3.2s;--spa:.5}
:is(tr.rk1,tr.rk2,tr.rk3) :is(td,span,b,strong,small,em):not(:has(*)):not(.rkpad):not(.crown):not(.dbadge),.dlv-extreme{
  --spd2:var(--spd,3.2s);--spa2:var(--spa,.65);
  background:radial-gradient(ellipse 50% 100% at 50% 50%,rgba(var(--splc,255,255,255),var(--spa2)),rgba(255,255,255,0) 70%) -60% 0/45% 100% no-repeat,linear-gradient(currentColor,currentColor);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;animation:spl var(--spd2) linear infinite}
:is(tr.rk1,tr.rk2,tr.rk3) :is(.spk:not(:has(*)),.spk .bdn):not(.dlv){filter:drop-shadow(0 0 4px currentColor)}
.dlv-extreme{--spd:3.2s;--spa:.65}
@keyframes spl{from{background-position:-60% 0,0 0}to{background-position:160% 0,0 0}}
@media (prefers-reduced-motion:reduce){:is(tr.rk1,tr.rk2,tr.rk3) :is(td,span,b,strong,small,em):not(:has(*)):not(.rkpad):not(.crown),.dlv-extreme{animation:none}}

/* b56: 순위 행 전체 글자(순위 숫자·횟수·메소량·아이템 등)에 스포트라이트, 익스트림은 더 굵게 + 검은 빛 */
.dlv-extreme{font-weight:900;--splc:0,0,0}

/* b57: (익스트림) 검은 눈부심 — 선명한 어두운 중심(코어) + 부드러운 번짐(헤일로) + 지나가는 순간만 번쩍이는 글로우. 2.8s 중 0~30%(약 0.84초)에 확 지나가고 나머지(약 2초)는 정지 */
html body .dlv-extreme.dlv-extreme.dlv-extreme.dlv-extreme{
  background:
    radial-gradient(ellipse 50% 110% at 50% 50%,rgba(0,0,0,.98) 0,rgba(0,0,0,.75) 28%,rgba(0,0,0,0) 100%) -40% 0/22% 100% no-repeat,
    radial-gradient(ellipse 50% 100% at 50% 50%,rgba(0,0,0,.55) 0,rgba(0,0,0,.25) 45%,rgba(0,0,0,0) 100%) -125% 0/60% 100% no-repeat,
    linear-gradient(currentColor,currentColor);
  -webkit-background-clip:text;background-clip:text;
  animation:spx 2.8s cubic-bezier(.35,0,.25,1) infinite}
@keyframes spx{
  0%{background-position:-40% 0,-125% 0,0 0;filter:drop-shadow(0 0 0 rgba(255,110,40,0))}
  14%{filter:drop-shadow(0 0 5px rgba(255,120,50,.95)) drop-shadow(0 0 10px rgba(255,69,0,.6))}
  30%{background-position:140% 0,225% 0,0 0;filter:drop-shadow(0 0 0 rgba(255,110,40,0))}
  30.01%,100%{background-position:-40% 0,-125% 0,0 0;filter:drop-shadow(0 0 0 rgba(255,110,40,0))}}
@media (prefers-reduced-motion:reduce){html body .dlv-extreme.dlv-extreme.dlv-extreme.dlv-extreme{animation:none}}

/* b58: 툴팁(모든 [data-tip], 그래프 점 포함) — 둥근 모서리·부드러운 그림자·작은 꼬리, 화면 안으로 위치 보정 */
#mbtTip{border-radius:12px;padding:9px 12px;background:rgba(21,23,28,.97);border:1px solid #3a3f4a;box-shadow:0 10px 28px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);transform:translateY(3px);transition:opacity .12s,transform .12s}
#mbtTip.show{transform:none}
#mbtTip::after{content:"";position:absolute;left:var(--ax,50%);bottom:-6px;width:10px;height:10px;margin-left:-5px;background:inherit;border-right:1px solid #3a3f4a;border-bottom:1px solid #3a3f4a;transform:rotate(45deg);border-radius:0 0 3px 0}
#mbtTip.below::after{bottom:auto;top:-6px;transform:rotate(225deg)}
.lpt rect{cursor:default}.lpt:hover circle,.mpt:hover circle:last-of-type{r:5.5}
@media (prefers-reduced-motion:reduce){#mbtTip{transition:none;transform:none}}
/* b61 모바일(≤760px): 못 가진 아이템 = 위 [아이콘 이름] / 아래 보스 목록(전체 폭, 묶음 단위 줄바꿈) — 잘림·가로 스크롤 없음 */
@media(max-width:760px){
  .misstbl tbody tr:not(.rkpad){display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"i n" "b b";align-items:center;height:auto;padding:4px 0;border-bottom:1px solid var(--line)}
  .misstbl tbody tr:not(.rkpad) td{height:auto;border:0;padding-top:2px;padding-bottom:2px}
  .misstbl td.missi{grid-area:i;width:auto}
  .misstbl td.missn{grid-area:n;width:auto;white-space:normal;font-weight:700}
  .misstbl td.missb{grid-area:b}
}
/* b61 낮은 창: 왼쪽 사이드바가 화면에 안 들어가면 sticky 해제(feedFit 이 .side-flow) → 페이지 스크롤로 소식·썬데이 카드까지 닿음 */
.side-sticky.side-flow{position:static}
/* b61 낮은 창(높이 <760px, 넓은 화면): 오른쪽 열(수익·결정석 가격·초기화)을 화면 높이 고정(sticky+안쪽 스크롤)에서 일반 흐름으로 → 잘림 없이 페이지 스크롤 */
@media(min-width:1181px) and (max-height:759px){
  .rcol{position:static;height:auto;max-height:none;overflow:visible}
  .rcol>.revpanel,.rcol>.pricecard{overflow:visible;max-height:none;flex:none}

  .rcol>.resetcard{margin-top:0}

function bossIcon(b){
  const src=BOSS_ICONS[b.id];
  if(src) return `<img class="bicon" src="${src}" alt="" aria-hidden="true">`;
  let h=0; for(const ch of b.id) h=(h*31+ch.charCodeAt(0))%360;
  return `<span class="bicon fb" style="--h:${h}" aria-hidden="true">${esc(b.name.replace(/^(선택받은|감시자|최초의|찬란한)\s*/,'').slice(0,1))}</span>`;
}

        if(m){ pc.meso=Math.max(0,(pc.meso||0)-m); minus+=m; } if(pc.count!=null) pc.count=pc.bosses.length; });
      h.total=Math.max(0,(h.total||0)-minus); if(cnt){ h.cleared=Math.max(0,(h.cleared||0)-cnt); if(h.crystals!=null) h.crystals=Math.max(0,h.crystals-cnt); } h.weeklyOnly=true; });

  { const ws=(S.history||[]).map(h=>h.week).filter(Boolean).sort(); const first=ws[0]||S.period?.week||weekId();
    if(!S.startWeek || first<S.startWeek) S.startWeek=first; }

/* ---------- 리셋 처리 ---------- */
function resetCore(){
  const now={week:weekId(),day:dayId(),month:monthId()}; let changed=false; const msgs=[];
  if(S.period.week!==now.week){
    missRecord('w',S.period.week,missNow('w')); // 지난 주 빠뜨린 보스메소 (초기화 전 상태로 계산)
    const sum=weekSummary(S.period.week);
    if(sum.cleared>0 && !S.history.some(h=>h.week===S.period.week)) S.history.push(sum);
    S.history.sort((a,b)=>a.week<b.week?-1:1);
    S.characters.forEach(c=>{c.weekly={}; c.drops={}; c.dropOut={}; delete c.dmode; delete c.drev; for(const k in c.auto) if(findBoss(k)?.type==='weekly') delete c.auto[k];});
    msgs.push('주간 보스가 초기화되었습니다 (지난 주 기록 저장됨)'); changed=true;
  }
  if(S.period.month!==now.month){
    missRecord('m',S.period.month,missNow('m'));
    const ms=monthSummary(S.period.month); if(ms.cleared>0 && !S.monthHistory.some(h=>h.month===ms.month)) S.monthHistory.push(ms);
    S.monthHistory.sort((a,b)=>a.month<b.month?-1:1);
    S.characters.forEach(c=>{c.monthly={}; c.mdate={}; c.mdrops={}; c.mdropOut={}; delete c.mdmode; delete c.mdrev; for(const k in c.auto) if(findBoss(k)?.type==='monthly') delete c.auto[k];}); msgs.push('월간 보스 초기화'); changed=true; }
  if(S.period.day!==now.day) changed=true;
  if(changed) S.period=now;
  return {changed,msgs};
}

function charCrystals(c){
  const list=[];
  for(const slot in c.bosses){
    const cfg=c.bosses[slot]; const b=findBoss(slot); if(!b||!cfg) continue;
    const ok = b.type==='weekly' ? !!c.weekly[slot] : !!c.monthly[slot];
    if(!ok) continue;
    const diff=cfg.diff, party=Math.max(1,Math.min(partyMax(b,diff),cfg.party||1));
    list.push({slot,name:b.name,type:b.type,diff,party,gross:price(b,diff),value:Math.floor(price(b,diff)/party),auto:!!c.auto[slot]});
  }
  list.sort((a,b)=>b.value-a.value);
  let w=0,m=0; list.forEach(x=>{ if(x.type==='weekly'){ x.counted = w < S.settings.weeklyLimit; w++; } else { x.counted = m < S.settings.monthlyLimit; m++; } });

}

  return {list:l, wlist:l.filter(x=>x.type==='weekly'), mlist:l.filter(x=>x.type==='monthly'), weekly:weeklyCount(c), meso:sum('weekly'), monthMeso:sum('monthly')}; }

    const diff=b.diffs.includes(cfg.diff)?cfg.diff:b.diffs[0], party=curParty(c,b.id);

const normName = s => String(s||'').replace(/[\s()·:\[\]「」]/g,'').toLowerCase();
const DIFF_MAP = {easy:'easy','이지':'easy',normal:'normal','노말':'normal','노멀':'normal',hard:'hard','하드':'hard',chaos:'chaos','카오스':'chaos',extreme:'extreme','익스트림':'extreme'};
const normDiff = s => DIFF_MAP[String(s||'').trim().toLowerCase()] || null;
// 2026-06 패치로 일일 보스가 되었거나 삭제되어 추적하지 않는 보스 (부분 일치로 '진 힐라' 등에 잘못 붙지 않도록 먼저 걸러냄)
const RETIRED_BOSS_NAMES = ['힐라','핑크빈','시그너스','카오스핑크빈'].map(normName);
function matchBoss(apiName){
  const n=normName(apiName); if(!n) return null;
  if(RETIRED_BOSS_NAMES.includes(n)) return null;
  const names=b=>[b.name,...(b.aliases||[])].map(normName);
  let hit=BOSSES.find(b=>names(b).includes(n)); if(hit) return hit;
  let best=null,len=0;
  // API 이름이 프리셋 이름을 '포함'할 때만 부분 일치 (예: '주시자 더스크' → 더스크). 반대 방향('힐라' ⊂ '진힐라')은 허용하지 않음
  for(const b of BOSSES) for(const a of names(b)) if(a.length>len && a.length>=2 && n.includes(a)){best=b;len=a.length;}
  return best;
}
/* 시즌 한정 보스 (예: '시즌 보스 메이린') — 주간 보스 표에 없는 것이 정상이므로 매칭 실패로 표시하지 않음 */
const isSeasonBoss = n => /시즌|메이린/.test(String(n||''));
/* 스케줄러 응답을 캐릭터에 반영. 완료된 보스만 체크(수동 체크는 지우지 않음). */
function applyScheduler(c, data){
  const d=String(data?.date||'').slice(0,10);
  const staleWeek = d && d < S.period.week, staleMonth = d && d.slice(0,7) < S.period.month;
  const unmatched=[]; let checked=0;
  const isDone = r => flagOn(r.complete_flag) || flagOn(r.clear_flag); // 공식 스펙: complete_flag (일부 문서는 clear_flag 표기)
  const rows=(data?.boss_contents||[]).slice().sort((a,b)=>isDone(b)-isDone(a));
  const seen={};
  for(const r of rows){
    const cyc=String(r.cycle||'').toLowerCase();
    if(/daily|일일|일간/.test(cyc)) continue; // 일일 보스는 추적하지 않음
    const b=matchBoss(r.content_name), diff=normDiff(r.difficulty);
    if(!b && RETIRED_BOSS_NAMES.includes(normName(r.content_name))) continue; // 일일 보스로 바뀐 보스
    if(!b && isSeasonBoss(r.content_name)) continue; // 시즌 보스(메이린 등)는 추적 대상이 아님 — '매칭 안 된 보스'에서 제외
    if(!b || !diff || !b.diffs.includes(diff)){ unmatched.push(`${r.content_name}(${r.difficulty||'?'})`); continue; }
    if(seen[b.id]) continue;
    const done=isDone(r), reg=flagOn(r.registration_flag);
    const cfg=c.bosses[b.id];
    if(done){
      if((b.type==='weekly'&&staleWeek)||(b.type==='monthly'&&staleMonth)) continue;
      seen[b.id]=true;
      c.bosses[b.id]={enabled:true,diff,party:cfg?.party||1}; clampParty(c,b.id);
      if(b.type==='weekly'){ if(!c.weekly[b.id]) checked++; c.weekly[b.id]=true; }
      else { if(!c.monthly[b.id]) checked++; c.monthly[b.id]=c.monthly[b.id]||S.period.week; (c.mdate||(c.mdate={}))[b.id]=(c.mdate||{})[b.id]||kstDay(); }
      c.auto[b.id]=true;
    } else if(reg){ // 스케줄러에 등록된 보스 = 이 캐릭터의 보스 (난이도도 API 값, 파티 인원은 유지)
      seen[b.id]=true; c.bosses[b.id]={enabled:true,diff,party:cfg?.party||1}; clampParty(c,b.id);
    }
  }
  // 보스 목록은 스케줄러만 따름: 응답에 보스 목록이 있으면, 거기 없는 보스는 끔 (이번 주/달 이미 체크한 건 유지, 파티 인원·드롭 기록은 남김)
  if(Array.isArray(data?.boss_contents)&&data.boss_contents.length) for(const [id,cfg] of Object.entries(c.bosses||{})){
    if(!cfg?.enabled||seen[id]) continue; const b=findBoss(id); if(!b) continue;
    if(isDone(c,b)) continue; cfg.enabled=false;
  }
  c.sync=Object.assign(c.sync||{},{at:Date.now(),ok:true,msg:'',clear:data?.weekly_boss_clear_count,limit:data?.weekly_boss_clear_limit_count,unmatched,date:d});
  if(data?.character_level) c.level=data.character_level;
  if(data?.character_class) c.job=data.character_class;
  if(data?.world_name) c.world=data.world_name;
  return checked;
}
// character/basic 의 character_exp(int64, 현재 레벨 보유 경험치) / character_exp_rate(string, 예 "51.234") 저장
function expFrom(b,fallbackLevel){
  const r=parseFloat(b?.character_exp_rate); if(!isFinite(r)) return null;
  return {rate:Math.max(0,Math.min(100,r)), exp:Number(b.character_exp)||0, level:Number(b.character_level)||Number(fallbackLevel)||0, date:b.date||'', at:Date.now()};
}
async function fetchBasic(c,key){
  const b=await nx('/maplestory/v1/character/basic',{ocid:c.ocid},key);
  const e=expFrom(b,c.level); if(e) c.exp=e;
  if(b.character_image) c.image=b.character_image;
  if(b.world_name) c.world=b.world_name;
  if(b.character_class) c.job=b.character_class;
  if(b.character_level) c.level=b.character_level;
  c.guild=String(b.character_guild_name||''); c.guildAt=Date.now(); // b85: 길드 현황 '+ 길드 추가' 후보
  c.sync=Object.assign(c.sync||{},{imgAt:Date.now()});
}

const DQ_TTL_MS = 10*60e3;      // 스케줄러 캐시 기본 수명 (길드 탭 등). 일퀘 탭은 자동 갱신 없음: 페이지 열 때 + 🔄 버튼
const GUILD_TTL_MS = 30*60e3;   // 길드 랭킹: 하루 1번(09:30경) 갱신 데이터라 30분 캐시
/* b85: 고정 길드('봉사활동') 삭제 → 사용자가 고른 길드들 S.settings.guilds=[{world,name}] (동기화됨). 랭킹 캐시는 길드별 */
const SCHED_KEY = 'mapleBossTracker.sched', GUILD_KEY = 'mapleBossTracker.guild2';
const gKey = g => g.world+'|'+g.name;
const guildList = () => Array.isArray(S.settings.guilds)?S.settings.guilds:[];
const lsGet = k => { try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
let schedC = lsGet(SCHED_KEY) || {};   // charId → {date, level, items{id:{st,now,max,reg,name}}, guild{suro,flag,mission}, at, ok, msg}
let guildC = lsGet(GUILD_KEY) || {};    // gKey → {date, t1, t2, at, ok, msg}
const GUILD_MARK_TTL=7*864e5;
const guildMarkHtml=G=>{ const m=guildC[gKey(G)]?.mark; return m?.src?`<img class="gmark" src="${esc(m.src)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'gmark gmark0',textContent:'🛡️'}))">`:'<span class="gmark gmark0">🛡️</span>'; };
let guildPick=false, guildCandBusy=false;
let dqBusy=false, guildBusy=false, dqEdit=false, apiPauseUntil=0;

function schedSummary(d){
  const daily=Array.isArray(d?.daily_contents)?d.daily_contents:[], weekly=Array.isArray(d?.weekly_contents)?d.weekly_contents:[];
  const nm=r=>normName(r?.content_name);
  const pick=r=>r?{st:String(r.quest_state??''),now:Number(r.now_count)||0,max:Number(r.max_count)||0,reg:flagOn(r.registration_flag),name:String(r.content_name||'')}:null;
  const items={};
  for(const it of DQ_ITEMS){
    let r=null;
    if(it.kind==='mp') r=daily.find(x=>nm(x)==='몬스터파크');
    else if(it.kind==='xmp') r=weekly.find(x=>nm(x).includes('익스트림몬스터파'))||daily.find(x=>nm(x).includes('익스트림몬스터파'));
    else r=daily.find(x=>nm(x).includes(normName(it.key)) && (x.type==='quest'||/일일/.test(x.content_name||'')));
    if(r) items[it.id]=pick(r);
  }
  const g=k=>{ const r=weekly.find(x=>nm(x).includes(k)); return r?{now:Number(r.now_count)||0,max:Number(r.max_count)||0}:null; };
  return {date:String(d?.date||'').slice(0,10)||dayId(), level:Number(d?.character_level)||0, items,
    guild:{suro:g('지하수로')} /* 2026-10-10: 플래그·주간 미션 표시 삭제 (같은 스케줄러 응답이라 API 호출 수는 그대로) */, at:Date.now(), ok:true, msg:''};
}
function schedPut(c,d){ schedC[c.id]=schedSummary(d); lsSet(SCHED_KEY,schedC); }
function schedErr(c,e){ schedC[c.id]={...(schedC[c.id]||{}),errAt:Date.now(),ok:false,msg:e.message,code:e.code||''}; lsSet(SCHED_KEY,schedC); }
/* 스케줄러 1회 호출 = 보스 자동 체크(applyScheduler) + 일퀘/길드 요약 저장 (동기화와 같은 경로) */
async function fetchSched(c,a){
  try{ const d=await nx('/maplestory/v1/scheduler/character-state',{ocid:c.ocid},a.key); schedPut(c,d); return d; }
  catch(e){ schedErr(c,e); throw e; }
}
const schedOk = c => !!(c.ocid && accOf(c)?.key);
const schedFresh = (c,ttl) => { const x=schedC[c.id]; const t=Math.max(x?.at||0,x?.errAt||0); return !!x && Date.now()-t<ttl && (!x.ok||x.date===dayId()); };
/* 열려 있는 탭에 필요한 캐릭터만, 오래된 것만(ttl) 순서대로 갱신. 동기화 중·호출량 초과 대기 중이면 건너뜀 */
async function refreshSched(chars, ttl=DQ_TTL_MS){
  if(dqBusy||syncing||Date.now()<apiPauseUntil) return;
  const todo=chars.filter(c=>schedOk(c)&&!schedFresh(c,ttl)); if(!todo.length) return;
  dqBusy=true; renderTabView(); let n=0;
  try{
    for(const c of todo){
      try{ n+=applyScheduler(c, await fetchSched(c,accOf(c))); }
      catch(e){ if(e.code==='OPENAPI00007'||e.status===429){ apiPauseUntil=Date.now()+DQ_TTL_MS; break; } if(e.code==='NETWORK') break; }
      renderTabView();
    }
    save();
    if(n) toast(`스케줄러 갱신 — 새로 체크된 보스 ${n}개`);
  } finally { dqBusy=false; renderChars(); renderTabView(); }
}
/* 길드 랭킹: 오늘 날짜(09:30 KST 이후) → 비었거나 준비 전이면 어제 */
async function refreshGuild(force){
  if(guildBusy||Date.now()<apiPauseUntil) return; const key=anyKey(); if(!key) return;
  const todo=guildList().filter(G=>{ const c=guildC[gKey(G)]; const ttl=c?.ok&&c.date===dayId()?3*GUILD_TTL_MS:GUILD_TTL_MS; return force||!c||Date.now()-(c.at||0)>=ttl; });
  if(!todo.length) return;
  guildBusy=true; renderTabView();
  const k=kst(), ready=k.getUTCHours()*60+k.getUTCMinutes()>=9*60+30;
  const days=(ready?[dayId()]:[]).concat(dayId(Date.now()-864e5));
  try{
    for(const G of todo){
      let got=null, lastErr=null, stop=false;
      for(const d of days){
        const rows={};
        try{
          for(const t of [2,1]){
            const r=await nx('/maplestory/v1/ranking/guild',{date:d,world_name:G.world,ranking_type:t,guild_name:G.name},key);
            rows[t]=(Array.isArray(r?.ranking)?r.ranking:[]).find(x=>x&&x.guild_name===G.name&&(!x.world_name||x.world_name===G.world))||null;
          }
        }catch(e){ lastErr=e; if(e.code==='OPENAPI00007'||e.status===429||e.code==='NETWORK'){ stop=true; break; } continue; }
        if(rows[1]||rows[2]){ got={date:d,t1:rows[1],t2:rows[2]}; break; }
      }
      const kk=gKey(G), prevMark=guildC[kk]?.mark;
      guildC[kk]=got?{...got,at:Date.now(),ok:true,msg:''}:{...(guildC[kk]||{}),at:Date.now(),ok:false,msg:lastErr?lastErr.message:`'${G.world}' 월드 랭킹에서 '${G.name}' 길드를 찾지 못했습니다`};
      if(prevMark) guildC[kk].mark=prevMark;
      // b99: 길드 마크 — guild/id → guild/basic. guild_mark_custom(base64) 우선, 없으면 guild_mark(URL). 7일 캐시
      if(!stop&&(!prevMark||Date.now()-(prevMark.at||0)>=GUILD_MARK_TTL)){
        try{
          const id=await nx('/maplestory/v1/guild/id',{guild_name:G.name,world_name:G.world},key);
          if(id?.oguild_id){ const gb=await nx('/maplestory/v1/guild/basic',{oguild_id:id.oguild_id},key);
            const cu=typeof gb?.guild_mark_custom==='string'&&gb.guild_mark_custom.trim(), mk=typeof gb?.guild_mark==='string'&&gb.guild_mark.trim();
            guildC[kk].mark={src:cu?(cu.startsWith('data:')?cu:'data:image/png;base64,'+cu):(mk&&/^https:\/\//.test(mk)?mk:''),at:Date.now()}; }
        }catch(e){ if(e.code==='OPENAPI00007'||e.status===429||e.code==='NETWORK') stop=true; }
      }
      lsSet(GUILD_KEY,guildC); renderTabView();
      if(stop) break;
    }
  } finally { guildBusy=false; renderTabView(); }
}
/* '+ 길드 추가' 후보: 보이는 캐릭터의 (월드, 길드). 길드 정보가 아직 없는 캐릭터는 character/basic으로 한 번 채움 */
async function fillGuildCands(){
  if(guildCandBusy) return; const todo=vchars().filter(c=>c.guildAt==null&&c.ocid&&accOf(c)?.key); if(!todo.length) return;
  guildCandBusy=true; renderTabView();
  try{ for(const c of todo){ try{ await fetchBasic(c,accOf(c).key); }catch(e){ if(e.code==='OPENAPI00007'||e.status===429||e.code==='NETWORK') break; } } save(); }
  finally{ guildCandBusy=false; renderTabView(); }
}
function guildCands(){ const have=new Set(guildList().map(gKey)), m=new Map();
  for(const c of vchars()) if(c.guild&&c.world){ const G={world:c.world,name:c.guild}, k=gKey(G); if(have.has(k)) continue; const e=m.get(k)||{...G,chars:[]}; e.chars.push(c.name); m.set(k,e); }
  return [...m.values()]; }

/* 항목 상태: lock(레벨 미달) · none(스케줄러에 없음) · done · prog · idle */
function dqState(it, x, lv){
  if(it.lv && lv && lv<it.lv) return 'lock';
  if(!x) return 'none';
  if(it.kind==='mp') return x.now>=Math.min(MP_CHAR_DAILY, x.max||MP_CHAR_DAILY)?'done':x.now>0?'prog':'idle';
  if(x.st==='2' || (it.kind==='xmp' && x.max>0 && x.now>=x.max)) return 'done';
  if(x.st==='1') return 'prog';
  return 'idle';
}
const DQ_TXT = {done:'완료', prog:'진행 중', idle:'미수락', none:'정보 없음'};
function dqCell(c, it, x, st, off){

  let txt=DQ_TXT[st], cnt='';
  if(x && it.kind==='mp'){ txt=st==='done'?'완료':''; cnt=`${Math.min(x.now,MP_CHAR_DAILY)}/${MP_CHAR_DAILY}회`; }
  else if(x && it.kind==='xmp'){ txt=st==='done'?'완료':'주간'; cnt=x.max>0?`${x.now}/${x.max}`:''; }
  else if(x && st==='prog' && x.max>0){ txt='진행'; cnt=`${x.now}/${x.max}`; }
  const tip = (x?.name||it.label)+(it.weekly?' (주간)':'')+(it.kind==='mp'?` · 오늘 ${x?.now??0}회 (캐릭터당 하루 ${MP_CHAR_DAILY}회, 스케줄러 최대 ${x?.max??'-'})`:'')+(dqEdit?'\n클릭: 이 캐릭터에서 '+(off?'다시 표시':'숨기기'):'');
  return `<div class="dqi s-${st}${off?' off':''}" style="--c:${it.col}" data-dqi="${it.id}" ${dqEdit?`data-dqc="${c.id}|${it.id}" role="button" tabindex="0"`:''} title="${esc(tip)}">
    <b class="dqn">${dqIco(it)}<span>${esc(it.label)}</span></b><span class="dqs">${esc(txt)}${cnt?`${txt?' ':''}<em>${cnt}</em>`:''}</span>

}

function meso(n){
  n=Math.round(n||0); if(n===0) return '0 메소';
  const eok=Math.floor(n/1e8), man=Math.floor(n%1e8/1e4), rest=n%1e4;
  let s=''; if(eok) s+=eok.toLocaleString()+'억 '; if(man) s+=man.toLocaleString()+'만'; if(!eok&&!man) s=rest.toLocaleString();
  return s.trim()+' 메소'; // b60: 금액에는 항상 '메소' 단위
}

/* ---------- 사용자 지정 순서 ----------
 * S.characters 배열 순서 = 월드 그룹 안에서의 표시 순서, S.worldOrder = 월드 그룹 순서.
 * 동기화·가져오기·본캐 지정은 이 순서를 바꾸지 않습니다(새 캐릭터는 맨 뒤에 추가). */
function worldGroups(){
  const groups=new Map();
  for(const w of S.worldOrder) groups.set(w,[]);
  for(const c of vchars()){ const w=worldOf(c); if(!groups.has(w)) groups.set(w,[]); groups.get(w).push(c); }
  for(const [w,cs] of groups) if(!cs.length) groups.delete(w);
  return groups;
}
const orderedChars = () => [...worldGroups().values()].flat();
function moveCharTo(id, targetId, after){
  if(id===targetId) return false;
  const arr=S.characters, c=arr.find(x=>x.id===id), t=arr.find(x=>x.id===targetId);
  if(!c||!t||worldOf(c)!==worldOf(t)) return false;
  arr.splice(arr.indexOf(c),1); arr.splice(arr.indexOf(t)+(after?1:0),0,c);
  save(); return true;
}
function moveCharBy(id, dir){
  const c=S.characters.find(x=>x.id===id); if(!c) return;
  const same=vchars().filter(x=>worldOf(x)===worldOf(c)); const i=same.indexOf(c), j=i+dir;
  if(j<0||j>=same.length) return;
  moveCharTo(id, same[j].id, dir>0);
}
function moveWorldTo(w, target, after){
  if(w===target) return false;
  const order=[...worldGroups().keys()]; if(!order.includes(w)||!order.includes(target)) return false;
  order.splice(order.indexOf(w),1); order.splice(order.indexOf(target)+(after?1:0),0,w);
  S.worldOrder=order; save(); return true;
}
function moveWorldBy(w, dir){ const order=[...worldGroups().keys()], j=order.indexOf(w)+dir; if(j<0||j>=order.length) return; moveWorldTo(w, order[j], dir>0); }

// EXP 줄: API 데이터가 있고 레벨이 일치할 때만 표시 (수동 캐릭터/레벨 불일치 시 숨김)
function expLine(c){
  const e=c.exp; if(!e||!isFinite(e.rate)) return '';
  if(e.level&&c.level&&+e.level!==+c.level) return '';
  const p=Math.max(0,Math.min(100,+e.rate));
  const tip=`EXP ${p.toFixed(3)}%`+(e.exp?` (${Number(e.exp).toLocaleString()})`:'')+(e.date?` · 기준 ${String(e.date).slice(0,10)}`:'');
  return `<div class="expl" title="${esc(tip)}"><span class="expbar" role="progressbar" aria-label="경험치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p.toFixed(2)}"><i style="width:${p.toFixed(2)}%"></i></span><span class="exppct">${p.toFixed(2)}%</span></div>`;
}
/* 사이드바 카드: 이번 주 주간 보스 12/12면 반투명 검정 덮개 + '★ 이번 주 보스 완료'
 * (월간 보스를 선택해 두었는데 이번 달 아직 안 잡았으면 그 아래 줄에 빨간 (!) '검마 격파 필요' 추가). 마우스를 올리면 사라짐, 클릭은 통과 */
function monthlyPending(c){ return BOSSES.filter(b=>b.type==='monthly'&&c.bosses?.[b.id]?.enabled&&!c.monthly?.[b.id]); }
function doneOverlay(c,r){

/* 사이드바 캐릭터 정렬 보기: 'base' = 기본순(저장된 순서) / 'undone' = 보스 미완료순(이번 주 12/12 안 된 캐릭터 먼저, 각 무리 안은 기본순 유지).
 * 보기 방식만 바꾸고 저장된 순서는 건드리지 않음. 기기별 표시 설정이라 localStorage(드라이브 동기화 안 함). */
const CHAR_SORT_KEY='mapleBossTracker.charSort';
const CSORTS=['base','undone','gm']; // gm = 검마 정렬순: 이번 달 검은 마법사 안 잡은 캐릭터 먼저 (각 무리 안은 기본순)
let charSort=(()=>{ try{ const v=localStorage.getItem(CHAR_SORT_KEY); return CSORTS.includes(v)?v:'base'; }catch(e){ return 'base'; } })();
const gmDone = c => !!c.monthly?.blackmage;
const sortedChars = cs => charSort==='gm' ? [...cs.filter(c=>!gmDone(c)), ...cs.filter(gmDone)] : charSort!=='undone' ? cs : [...cs.filter(c=>weeklyCount(c)<S.settings.weeklyLimit), ...cs.filter(c=>weeklyCount(c)>=S.settings.weeklyLimit)];
function setCharSort(v){ charSort=CSORTS.includes(v)?v:'base'; try{ localStorage.setItem(CHAR_SORT_KEY,charSort); }catch(e){} render(); }
/* 캐릭터 목록: 8명까지 보이고 넘으면 목록 안에서 스크롤 (페이지는 안 늘어남).
 * 데스크톱에서 화면이 낮아 8줄 + 소식 카드 최소 높이가 안 들어가면 들어가는 만큼만(최소 4줄) 보여 줌 → 사이드바 때문에 페이지가 길어지지 않음. */
const CHAR_ROWS=8, CHAR_ROWS_MIN=4, SIDE_FEED_MIN=31*2+70+12; // 소식 카드 최소 높이(feedFit 의 minH) + 카드 간격
function fitCharList(){ // 2026-10-10: 스크롤 대신 페이지(8명) — 높이 제한 없음
  { const el=$('#charList'); if(el){ el.style.maxHeight=''; el.classList.remove('scroll'); } return; }
  const el=$('#charList'); if(!el) return; const cs=[...el.querySelectorAll('.char[data-id]')], st=el.scrollTop;
  el.style.maxHeight=''; el.classList.remove('scroll');
  let n=CHAR_ROWS;
  if(cs.length>CHAR_ROWS_MIN && !matchMedia('(max-width:820px)').matches){
    const aside=el.closest('.side-sticky'), card=el.closest('.card');
    if(aside&&card){
      const A=aside.getBoundingClientRect(), relTop=el.getBoundingClientRect().top-A.top, padB=card.getBoundingClientRect().bottom-el.getBoundingClientRect().bottom;
      const stick=parseFloat(getComputedStyle(aside).top)||0, docTop=A.top+scrollY;
      const foot=$('.foot'), main=aside.parentElement, below=parseFloat(getComputedStyle(main).paddingBottom)+(foot?foot.offsetHeight:0);
      const room=Math.min(innerHeight-stick-16, innerHeight-docTop-below)-relTop-padB-SIDE_FEED_MIN; // 목록이 쓸 수 있는 높이
      const top=el.getBoundingClientRect().top;
      while(n>CHAR_ROWS_MIN && cs[n-1] && cs[n-1].getBoundingClientRect().bottom-top>room) n--;
    }
  }
  if(cs.length<=n) return;
  const top=el.getBoundingClientRect().top, b=cs[n-1].getBoundingClientRect().bottom;
  el.style.maxHeight=Math.ceil(b-top+2)+'px'; el.classList.add('scroll'); el.scrollTop=st;
  const on=el.querySelector('.char.on'); if(on){ const r=on.getBoundingClientRect(), R=el.getBoundingClientRect(); if(r.top<R.top||r.bottom>R.bottom) el.scrollTop+=r.top-R.top-4; }
}
addEventListener('resize',()=>{ fitCharList(); });

  const multi=worlds.length>1;
  const sortCtl=`<span class="charsort" role="group" aria-label="캐릭터 정렬 (보기만 바뀌고 저장된 순서는 그대로)">${[['base','기본순','내가 정한 순서'],['undone','보스 미완료순','이번 주 주간 보스 12개를 아직 다 안 잡은 캐릭터 먼저 (각 무리 안은 기본순)'],['gm','검마 정렬순','이번 달 검은 마법사를 아직 안 잡은 캐릭터 먼저 (각 무리 안은 기본순)']].map(([k,l,t])=>`<button type="button" class="sortlink${charSort===k?' on':''}" data-csort="${k}" aria-pressed="${charSort===k}" title="${t}">${l}</button>`).join('')}</span>`;
  if(tabsEl) tabsEl.innerHTML=`<span class="wtablist" role="tablist" aria-label="월드">${worlds.map((w,i)=>(i?'<span class="wdiv" aria-hidden="true">ㅣ</span>':'')+

  pg.hidden=pages<=1;
  el.innerHTML=list.slice(p0,p0+CHAR_PER_PAGE).map((c,cj)=>{const ci=p0+cj; const r=cRev(c);return `
    <div class="char ${c.id===S.activeId?'on':''}${charSort==='gm'?(gmDone(c)?' gmdone':''):r.weekly>=S.settings.weeklyLimit?' alldone':''}" data-id="${c.id}" data-world="${esc(w)}" draggable="${fixed?'false':'true'}">
      ${charSort==='gm'?(gmDone(c)?'<div class="dov gmov" aria-hidden="true"><div class="dov-t"><span class="dov-ok"><b class="dov-star">★</b>이번 달 검마 완료</span></div></div>':''):doneOverlay(c,r)}

      ${avatar(c)}
      <div class="grow"><div class="nm">${esc(c.name)}</div><div class="meta lvrow"><span class="lv">Lv.${esc(c.level||'?')}</span><span class="job">${esc(c.job||'직업 미설정')}</span></div>${expLine(c)}</div>
      <div style="text-align:right"><div class="rev">${meso(r.meso)}</div><div class="meta">${r.weekly}/${S.settings.weeklyLimit}${needAssign(c)?' <span class="warnc" title="넥슨 계정 미지정 — ✎ 편집에서 계정을 선택하세요">⚠</span>':c.sync?.ok===false?' <span title="'+esc(c.sync.msg)+'">⚠</span>':''}</div></div>

      <button class="btn sm plain" data-edit="${c.id}" title="수정">✎</button>
    </div>`}).join('');
  // 마지막 쪽도 8줄 높이 유지 → 쪽 버튼·아래 카드가 움직이지 않음
  el.style.minHeight='';
  if(pages>1){ const rows=el.querySelectorAll('.char[data-id]'); if(rows.length){ const r0=rows[0].getBoundingClientRect(), gap=rows.length>1?rows[1].getBoundingClientRect().top-r0.bottom:parseFloat(getComputedStyle(el).rowGap)||8;

/* ---------- 드래그 앤 드롭: 데스크톱은 HTML5 DnD, 터치는 Pointer Events (⠿ 손잡이) ---------- */
let dnd=null; // {kind:'char'|'world', id, el}
function dndTarget(el, clientY, clientX){
  if(!dnd||!el) return null;
  if(dnd.kind==='char'){
    const t=el.closest('.char[data-id]'); if(!t||t===dnd.el||t.dataset.world!==dnd.el.dataset.world) return null;
    const r=t.getBoundingClientRect(); return {el:t, id:t.dataset.id, after: clientY>r.top+r.height/2};
  }
  const t=el.closest('.wtab[data-world]'); if(!t) return null;
  const w=t.dataset.world; if(w===dnd.id) return null;
  const r=t.getBoundingClientRect(); return {el:t, id:w, after: clientX>r.left+r.width/2};
}
function dndMark(t){
  document.querySelectorAll('.drop-before,.drop-after').forEach(e=>e.classList.remove('drop-before','drop-after'));
  if(t) t.el.classList.add(t.after?'drop-after':'drop-before');

function dndStart(kind,id,el){ dnd={kind,id,el}; el.classList.add('dragging'); document.body.classList.add('is-dragging'); }
function dndFinish(t){

  if(d) d.el.classList.remove('dragging');
  if(d&&t){ const ok = d.kind==='char' ? moveCharTo(d.id,t.id,t.after) : moveWorldTo(d.id,t.id,t.after); if(ok) toast('순서를 변경했습니다'); }

const charList=document.getElementById('charList').closest('.card'); // 월드 탭 + 캐릭터 목록 (드래그 이벤트 범위)

    <div class="price"><b>${meso(Math.floor(p/party))}</b>${party>1?`<br><span>(${meso(p)} ÷ ${party})</span>`:''}</div>

/* 캐릭터 별 기록 (2026-10-10): 2026.10.08(이번 주 시작)부터 계속 쌓임, 초기화 없음.
 * 주간 수익 = 지난 주간 기록(S.history) + 이번 주 / 월간 = 월간 기록(S.monthHistory) + 이번 달 / ★득템 = 같은 기간 기록한 드롭 (아이템별 합계) */
const REC_START='2026-10-08';
function charRecords(){
  const a=allRevenue(), R={};
  const get=(id,name)=>R[id]||(R[id]={w:0,m:0,items:{},name});
  const addItems=(r,items)=>{ for(const [k,n] of Object.entries(items||{})){ const {it}=parseIK(k); if(ITEMS[it]&&+n>0) r.items[it]=(r.items[it]||0)+(+n); } };
  (S.history||[]).filter(h=>String(h.week)>=REC_START).forEach(h=>(h.perChar||[]).forEach(p=>{ const r=get(p.id,p.name); r.w+=+p.meso||0; addItems(r,p.items); }));
  (S.monthHistory||[]).filter(h=>String(h.month)>=REC_START.slice(0,7)).forEach(h=>(h.perChar||[]).forEach(p=>{ const r=get(p.id,p.name); r.m+=+p.meso||0; addItems(r,p.items); }));
  a.per.forEach(p=>{ const r=get(p.c.id,p.c.name); r.w+=p.r.meso; r.m+=p.r.monthMeso||0; addItems(r,charAllDrops(p.c).items); });

}
function lootHtml(items){

}

// (주간 기록 탭 · renderHistory 는 2026-10-10 삭제 — S.history 데이터는 '캐릭터 별 기록'·'총 수익' 탭이 계속 사용)
/* 총 수익: 시작 주(S.startWeek)부터 저장된 모든 주간 기록 + 이번 주, 월간 보스는 별도 합계. 기록은 자동 삭제되지 않음 */
function totalData(){
  const VI=visibleCharIds(); // b82: 보이는 캐릭터만
  const weeks=[...S.history.slice().sort((a,b)=>a.week<b.week?-1:1).map(h=>({...visHist(h,VI),cur:false})),{...visHist(weekSummary(S.period.week),VI),cur:true}];
  const months=[...S.monthHistory.map(m=>({...visHist(m,VI),cur:false})),{...visHist(monthSummary(S.period.month),VI),cur:true}];
  // b110: 아이템 판매값을 판 캐릭터(perChar)·그 기간(주간 기록 = 주간 보스 아이템, 월간 기록 = 검은 마법사 아이템)에 더함 — 저장된 기록은 그대로, 복사본만
  const withSale=h=>{ const pc=(h.perChar||[]).map(p=>{ const isale=revSum(p.revs); return isale?{...p,crys:+p.meso||0,isale,meso:(+p.meso||0)+isale}:p; });
    const isale=pc.reduce((t,p)=>t+(p.isale||0),0); return isale?{...h,perChar:pc,crys:h.total||0,isale,total:(h.total||0)+isale}:h; };
  weeks.forEach((w,i)=>weeks[i]=withSale(w)); months.forEach((m,i)=>months[i]=withSale(m));
  const wTotal=weeks.reduce((s,w)=>s+(w.total||0),0), mTotal=months.reduce((s,m)=>s+(m.total||0),0);
  const chars={}, items={};
  const nameOf=p=>{ const c=p.id&&S.characters.find(x=>x.id===p.id); return c?c.name:p.name; };
  const keyOf=p=>p.id&&S.characters.some(x=>x.id===p.id)?p.id:'n:'+p.name;
  const ring={r4:0,c4:0,gl:0,x:0,un:0}, sales={}; // b62-8: 아이템 판매 수익 {실제 아이템 키: {n, m}}
  const addS=p=>{ for(const r of Object.values(p.revs||{})){ if(!r||!(+r.m>0)) continue; const pp=Math.max(1,+r.p||1), k=String(r.i||'')+'#'+pp; const o=sales[k]||(sales[k]={n:0,m:0,i:String(r.i||''),p:pp}); o.n++; o.m+=+r.m; } }; // b76: 분배 인원별로 따로
  weeks.forEach(w=>(w.perChar||[]).forEach(addS)); months.forEach(m=>(m.perChar||[]).forEach(addS));
  const add=(p,f)=>{ const k=keyOf(p); const o=chars[k]||(chars[k]={id:k,name:nameOf(p),week:0,month:0,items:{},outs:{},weeks:0}); f(o);
    for(const [ik,n] of Object.entries(p.items||{})){ const {it,party,mode}=parseIK(ik); if(!ITEMS[it]) continue; const a=party>1?it+'#'+party+mode:it; o.items[a]=(o.items[a]||0)+(+n);
      const I=items[a]||(items[a]={n:0,by:{},outs:[]}); I.n+=+n; I.by[o.name]=(I.by[o.name]||0)+(+n);
      if(hasOut(it)){ const l=(p.outcomes||{})[ik]||[]; I.outs.push(...l); (o.outs[a]=o.outs[a]||[]).push(...l); if(isRing(it)&&mode!=='l'){ const t=outTally(l,n); for(const q in ring) ring[q]+=t[q]; } } } }; // 블빵패배 상자의 결과는 내 시드링이 아님
  // 보스(난이도)별 아이템: 난이도는 그 주 기록의 보스 태그 '이름(난이도)' → 없으면 현재 캐릭터 설정
  const byBoss={};
  const addB=p=>{ const tags={}; (p.bosses||[]).forEach(t=>{ const m=/^(.+?)\((.+?)\)/.exec(t); if(m) tags[m[1]]=m[2]; });
    const cc=p.id&&S.characters.find(x=>x.id===p.id);
    for(const [ik,n] of Object.entries(p.items||{})){ const {slot,it,mode}=parseIK(ik); const b=findBoss(slot); if(!b||!ITEMS[it]||!(+n>0)) continue; const sf=mode?'@'+mode:''; // 블빵승리/패배는 따로 집계
      const dl=tags[b.name]||(cc&&cc.bosses[slot]?.diff?D[cc.bosses[slot].diff]:'');
      const bk=slot+'|'+dl, o=byBoss[bk]||(byBoss[bk]={slot,dl,items:{},cnt:0}); let u=+n; o.cnt+=+n; // b83: cnt = 드롭 표에 기록한 아이템 수(1개=1회)
      if(isRing(it)){ const ro=o.ro||(o.ro={}), t=ro[it+sf]||(ro[it+sf]={r4:0,c4:0,x:0}); ((p.outcomes||{})[ik]||[]).forEach(q=>{ if(q in t) t[q]++; }); } // b111: 보스 득템왕 반지 상자 결과
      if(isRing(it)) ((p.outcomes||{})[ik]||[]).forEach(q=>{ if(q==='gl') o.items['g_life'+sf]=(o.items['g_life'+sf]||0)+1; });
      if(it==='chaosbox') ((p.outcomes||{})[ik]||[]).forEach(q=>{ if(/^cb:/.test(q)&&ITEMS[q.slice(3)]&&u>0){ o.items[q+sf]=(o.items[q+sf]||0)+1; u--; } });
      if(u>0) o.items[it+sf]=(o.items[it+sf]||0)+u; } };
  weeks.forEach(w=>(w.perChar||[]).forEach(addB)); months.forEach(m=>(m.perChar||[]).forEach(addB));
  weeks.forEach(w=>(w.perChar||[]).forEach(p=>add(p,o=>{o.week+=p.meso||0; if(p.meso) o.weeks++;})));
  months.forEach(m=>(m.perChar||[]).forEach(p=>add(p,o=>{o.month+=p.meso||0;})));
  return {weeks,months,wTotal,mTotal,grand:wTotal+mTotal,ring,byBoss,sales,chars:Object.values(chars).sort((a,b)=>(b.week+b.month)-(a.week+a.month)),items:Object.entries(items).sort((a,b)=>b[1].n-a[1].n)};
}
// 아이템 칩: 'cb:<장신구>' = 칠흑 상자에서 고른 장신구, 'ring:r4|c4' = 시드링 결과
const lootSf = k => /@([wl])$/.exec(k)?.[1]||'', lootBase = k => k.replace(/@[wl]$/,'');
const lootName0 = k => /^cb:/.test(k)?ITEMS[k.slice(3)].n : k==='ring:r4'?OUT_NAME.r4 : k==='ring:c4'?OUT_NAME.c4 : ITEMS[k].n;
const lootName = k => /^x:/.test(k)?ITEMS[k.slice(2)].n+' · 꽝':lootName0(lootBase(k));
const lootIco = k => /^x:/.test(k)?itemIcon(k.slice(2)):lootIco0(lootBase(k));
const lootIco0 = k => /^cb:/.test(k)?itemIcon(k.slice(3)) : k==='ring:r4'?miniIcon('ring_restraint') : k==='ring:c4'?miniIcon('ring_continuous') : itemIcon(k);
const lootOrd = k => /^x:/.test(k)?Object.keys(ITEMS).indexOf(k.slice(2))+.5:lootOrd0(lootBase(k))+({w:.001,l:.002}[lootSf(k)]||0);
const lootOrd0 = k => /^cb:/.test(k)?Object.keys(ITEMS).indexOf('chaosbox')+.01*(1+CHAOS_PICK.indexOf(k.slice(3))) : /^ring:/.test(k)?-1+(k==='ring:c4'?.5:0) : Object.keys(ITEMS).indexOf(k);
const modeTag = k => lootSf(k)?` <span class="ptx ptx-${lootSf(k)}">(${MODE_TXT[lootSf(k)]})</span>`:'';
/* b111: 칠흑 상자에서 고른 장신구(cb:*)를 '혼돈의 칠흑 장신구 상자' 하나로 합침 → 마우스를 올리면 말풍선에 장신구별 아이콘·개수 */
function chaosTip(C,un){ const ks=Object.keys(C).filter(k=>C[k]>0).sort((a,b)=>C[b]-C[a]||itemCmp(a,b));
  return `<b class="tth">${esc(ITEMS.chaosbox.n)}</b>${ks.map(k=>`<span class="ttr">${itemIcon(k)}<span>${esc(ITEMS[k].n)}</span> <b>${xN(C[k])}</b></span>`).join('')}${un?`<span class="ttr muted">미기록 ${xN(un)}</span>`:''}${!ks.length&&!un?'<span class="ttr muted">기록 없음</span>':''}`; }
function chaosMerge(m){ const o={}, tips={}, by={};
  for(const [k,n] of Object.entries(m)){ if(!(n>0)) continue; const sf=lootSf(k), b=lootBase(k);
    if(/^cb:/.test(b)||b==='chaosbox'){ const kk='chaosbox'+(sf?'@'+sf:''); o[kk]=(o[kk]||0)+n; const t=by[kk]||(by[kk]={C:{},un:0}); if(b==='chaosbox') t.un+=n; else t.C[b.slice(3)]=(t.C[b.slice(3)]||0)+n; }
    else o[k]=(o[k]||0)+n; }
  for(const kk in by) tips[kk]=chaosTip(by[kk].C,by[kk].un);
  return {m:o,tips}; }
const tipAttr = h => h?` data-tip="${esc(ITEMS.chaosbox.n)}" data-tiphtml="${esc(h)}"`:'';
/* b111: 보스 강함 순서 (강한 것 먼저): 그란디스(유피테르→세렌), 찬란한 흉성(노말) 바로 아래 스우(익스트림), 검은 마법사, 아케인리버(듄켈→루시드), 그 밖 보스는 맨 뒤(강한 것 먼저) */
const STR_ORD=['jupiter','bellona','baldrix','limbo','star','kaling','adversary','kalos','seren','blackmage','dunkel','jinhilla','dusk','will','lucid'];

const lootChips = (m,top,tips) => `<span class="loots">${Object.keys(m).filter(k=>m[k]>0).sort((a,b)=>itemCmp(a,b)).map(k=>`<span class="loot${lootSf(k)?' md-'+lootSf(k):''}"${tipAttr(tips&&tips[k])}>${/^cb:/.test(k)?miniIcon('chaosbox')+' - ':''}${lootIco(k)}<span class="ln${top&&itemCol(k)?' spk '+itemCol(k):''}">${esc(lootName(k))}${lootSf(k)?` <span class="ptx ptx-${lootSf(k)}">(${MODE_TXT[lootSf(k)]})</span>`:''}</span> <b class="lx">${xN(m[k])}</b></span>`).join('')}</span>`;
// 시드링 기댓값: 상자 종류별 (획득 상자 수 × 상자 1개의 리4/컨4 확률) 합. 확률 = BOX_INFO (넥슨 공식 확률 공개, 툴팁과 같은 값)
function ringExp(T){ const e={r4:0,c4:0}; T.items.forEach(([a,I])=>{ const {it}=parseIK(a); const p=ring4(it); if(p){ e.r4+=I.n*p.r4/100; e.c4+=I.n*p.c4/100; } }); return e; }
const fmtExp=v=>(Math.round(v*100)/100).toFixed(2);

/* b60: 득템 분석 탭 — 결정석 분석에서 옮긴 득템 관련 카드들(모양 그대로) + 맨 위 '누적 득템' 3칸 */
const RING_NOCOUNT = new Set(['r_green','r_red']); // 총 득템·반상 누적에서 제외하는 반지 상자
/* b111: 상위 % = 포아송 이항분포 P(X ≥ 실제). ps = 시행마다 성공 확률 → 성공 k번 이상 나올 확률(%) */
function pbTail(ps,k){ if(k<=0) return 100; let d=[1]; for(const p of ps){ const n=new Array(d.length+1).fill(0); for(let i=0;i<d.length;i++){ n[i]+=d[i]*(1-p); n[i+1]+=d[i]*p; } d=n; }
  let t=0; for(let i=k;i<d.length;i++) t+=d[i]; return Math.min(100,Math.max(0,t*100)); }
const topPct=v=>v==null?'-':`상위 ${v>=0.1||v===0?(Math.round(v*10)/10):Number(v.toPrecision(1))}%`;
function lootSummary(T){
  let items=0, rings=0; const byBox={}, tl={r4:0,c4:0}, ex={r4:0,c4:0}, ps=[];
  T.items.forEach(([a,I])=>{ const {it,mode}=parseIK(a); if(mode==='l') return; // 블빵패배는 얻은 게 아님
    if(isRing(it)){ const t=outTally(I.outs,I.n); items+=t.r4+t.c4; // b111: 상자에서 나온 리4·컨4도 득템 1개씩 (녹옥·홍옥 포함)
      if(RING_NOCOUNT.has(it)) return; items+=I.n; rings+=I.n; byBox[it]=(byBox[it]||0)+I.n;
      tl.r4+=t.r4; tl.c4+=t.c4; const q=ring4(it); if(q){ ex.r4+=I.n*q.r4/100; ex.c4+=I.n*q.c4/100; const rec=t.r4+t.c4+t.gl+t.x; for(let i=0;i<rec;i++) ps.push((q.r4+q.c4)/100); } }
    else items+=I.n; });
  const st=bbangStats(T), wins=Object.values(st).reduce((x,q)=>x+q.w,0);
  const E=epicCounts(T), ek=Object.keys(E).sort((a,b)=>E[b]-E[a]||itemCmp(a,b))[0];
  const bk=Object.keys(byBox).sort((a,b)=>byBox[b]-byBox[a]||itemCmp(a,b))[0];
  const exp=ex.r4+ex.c4, rate=exp>0?(tl.r4+tl.c4)/exp*100:null;
  const ringTop=ps.length?pbTail(ps,tl.r4+tl.c4):null; // 결과를 기록한 상자만 시행으로 셈
  const bp=[]; let games=0; for(const [n,q] of Object.entries(st)){ const k=+n; if(!(k>=2)) continue; for(let i=0;i<q.w+q.l;i++) bp.push(1/k); games+=q.w+q.l; }
  const bbTop=games?pbTail(bp,wins):null, bbRows=[2,3,4,5,6].filter(k=>st[k]&&(st[k].w+st[k].l)).map(k=>`${k}인 (${st[k].w}승 ${st[k].l}패)`);
  return {items,rings,wins,ringTop,bbTop,bbRows,epicIco:ek?lootIco(ek):itemIcon('genesis'),boxIco:itemIcon(bk||'r_black'),rate};
}

 *  결정석 가격 자동 갱신 — 사이트의 prices.json (GitHub Actions 가 매일 공식 업데이트 공지에서 가격표를 읽어 갱신)
 *  - 가격은 직접 수정할 수 없고, 기본 가격(PRICE_CONFIG)을 공식 값으로 바꿔서 사용
 *  - 적용일(effective)이 아직 안 된 항목은 그날이 될 때까지 기존 값 유지
 *  - 마지막으로 받은 prices.json 은 이 브라우저에 보관 (다음 접속 때 바로 적용, 드라이브에는 넣지 않음)
 * ===================================================================== */
const PRICES_CACHE_KEY='mapleBossTracker.officialPrices';
let officialInfo=null; // {checkedAt, source:{url,title,date}, applied, pending:[{key,effective,price}]}
function parseBossLabel(label){
  const m=/^(.*?)\s*[(（]\s*(.+?)\s*[)）]\s*$/.exec(String(label||'').trim()); if(!m) return null;
  const b=matchBoss(m[1]), d=normDiff(m[2]); if(!b||!d||!b.diffs.includes(d)) return null;
  return {b,d};
}
// 테섭 예정 가격으로 잠깐 바꿔 계산 (예정 가격이 없으면 null)
function withUpcoming(fn){ const up=officialInfo&&officialInfo.upcoming; if(!up||!Object.keys(up).length) return null; const keep={};
  for(const k in up){ keep[k]=PRICE_CONFIG[k]; PRICE_CONFIG[k]=up[k]; } try{ return fn(); } finally{ for(const k in keep) PRICE_CONFIG[k]=keep[k]; } }
function applyOfficialPrices(pj){
  if(!pj||!Array.isArray(pj.rows)) return false;
  const today=dayId(); let changed=false, applied=0; const pending=[];
  for(const r of pj.rows){ const m=parseBossLabel(r.boss); const v=Math.round(+r.new); if(!m||!(v>0)) continue;
    const k=priceKey(m.b,m.d);
    if(r.effective && r.effective>today){ pending.push({key:k,effective:r.effective,price:v}); continue; } // 적용일 전에는 기존 값 유지
    if(PRICE_CONFIG[k]!==v){ PRICE_CONFIG[k]=v; changed=true; } applied++;
  }
  // 테섭 예정 가격 (pj.upcoming): 실서버 가격은 그대로, 다른 값만 '테섭 예정 → N' 표시
  const upcoming={}; for(const r of (pj.upcoming&&pj.upcoming.rows)||[]){ const m=parseBossLabel(r.boss); const v=Math.round(+r.new); if(m&&v>0){ const k=priceKey(m.b,m.d); if(PRICE_CONFIG[k]!==v) upcoming[k]=v; } }
  officialInfo={checkedAt:pj.checkedAt||'', changedAt:pj.changedAt||'', source:pj.source||{}, applied, pending, upcoming, upSource:(pj.upcoming&&pj.upcoming.source)||null};
  return changed;
}
function loadOfficialPrices(){
  try{ const c=JSON.parse(localStorage.getItem(PRICES_CACHE_KEY)||'null'); if(c) applyOfficialPrices(c); }catch(e){}
  if(!/^https?:$/.test(location.protocol)) return; // 파일로 연 경우: 내장 기본값 사용
  fetch(`./prices.json?d=${dayId()}`,{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(pj=>{
    if(!pj||!Array.isArray(pj.rows)||!pj.rows.length) return;
    localStorage.setItem(PRICES_CACHE_KEY,JSON.stringify(pj));
    if(applyOfficialPrices(pj)) save(); render();
  }).catch(()=>{});
}

const SV_TOKEN_KEY='mapleBossTracker.svToken', SV_DEVICE_KEY='mapleBossTracker.svDevice', SV_SUBSIG_KEY='mapleBossTracker.svSubSig', SV_USER_KEY='mapleBossTracker.svUser'; // svUser = 이 기기에서 마지막으로 로그인한 서버 사용자 (다른 사용자로 로그인하면 이 PC 데이터를 올리지 않고 비움) // svDevice = 초대 비밀번호를 통과한 기기 표 (로그아웃해도 유지)

// (b67: svDev — 초대 비밀번호 기기 표 — 더 이상 쓰지 않음. 예전 기기의 mapleBossTracker.svDevice 값은 남아 있어도 무시)
const svTok=()=>{ try{ return localStorage.getItem(SV_TOKEN_KEY)||''; }catch(e){ return ''; } };

const SV_RELOGIN='로그인이 만료되었어요 — 캐릭터 추가(+ 추가)에서 본계정 API 키로 다시 로그인해 주세요 (데이터는 서버와 이 PC에 그대로 있어요)';
const SV_VAULT_KEY='mapleBossTracker.svVault', SV_KEYERR_KEY='mapleBossTracker.svKeyErr'; // b62: 이 기기 로그인 때 금고 상태(open|none|locked) · 마지막 키 보관 오류
const SV_NEED_LOGIN='로그인이 필요해요 — 캐릭터 추가(+ 추가)에서 본계정 API 키를 등록하면 이어서 동기화돼요 (바꾼 내용은 이 PC에 그대로 있어요)';
let svGen=0; // b69: 로그아웃·초기화 때마다 +1 → 그 전에 시작한 서버 요청의 결과는 버림 (로그아웃 뒤 늦게 온 응답이 데이터를 되살리지 않게)
async function svFetch(path,opt={}){

  if(r.status===401&&!opt.noAuth){ svWipeAll({keepPending:true,broadcast:true}); gd.svErr=SV_RELOGIN; setTimeout(()=>{ gdRender(); if($('#importModal')?.classList.contains('show')) openImport(); },0); throw Object.assign(new Error(SV_NEED_LOGIN),{type:'interaction_required'}); }

async function driveToken(interactive=gd.ia){

/* ---- 동기화 비교·병합 (2026-10-10) ----

 * 병합 = 3-way: 마지막으로 맞춘 내용(base, localStorage GD_BASE_KEY) 기준으로 한쪽만 바뀐 항목은 그쪽 값, 양쪽이 같은 항목을 다르게 바꾼 경우만 '충돌'.
 *   캐릭터·계정은 id, 주간/월간 기록은 week/month 로 짝지음. 한쪽 삭제 + 다른 쪽 수정 → 수정본 유지(데이터 안 잃음).

const GD_BASE_KEY=SV_ON?'mapleBossTracker.svbase':'mapleBossTracker.gdbase';

function gdMerge(b,l,r,ctx,p=''){

function gdMergeKeyed(b,l,r,kf,ctx,p){

  if(t==='popup_closed') return {short:'로그인 창이 닫혔습니다 — 다시 연결을 눌러 주세요',html:`<p><b>로그인을 끝내기 전에 구글 로그인 창이 닫혔습니다.</b> 다시 시도해 주세요.</p><ul><li>${GD_UNVERIFIED_HELP}</li><li>${GD_TEST_USER_HELP}</li></ul>`};
  if(t==='access_denied') return {short:'구글 로그인이 거부되었습니다 (테스트 사용자 등록 확인)',html:`<p><b>구글이 로그인을 허용하지 않았습니다 (access_denied).</b></p><ul><li>${GD_TEST_USER_HELP}</li><li>권한 화면에서 <b>취소</b>를 눌렀다면 다시 시도해 <b>계속/허용</b>을 눌러 주세요.</li></ul>`};
  if(t==='scope') return {short:'드라이브 권한에 체크하지 않았습니다',html:`<p><b>드라이브 권한이 허용되지 않았습니다.</b> 다시 로그인해서 권한 화면의 <b>Google Drive 앱 데이터(자체 구성 데이터)</b> 항목에 체크한 뒤 계속을 눌러 주세요. 이 권한으로는 이 앱이 만든 숨김 파일 하나만 다루며, 내 드라이브의 다른 파일은 볼 수 없습니다.</p>`};
  if(t==='popup_failed_to_open') return {short:'로그인 팝업이 차단되었습니다 — 다시 연결을 눌러 주세요',html:`<p><b>브라우저가 구글 로그인 팝업을 막았습니다.</b> 상단의 <b>☁ 다시 연결</b>을 직접 눌러 주세요. 그래도 안 되면 주소창 오른쪽의 팝업 차단 아이콘에서 이 사이트의 팝업을 <b>항상 허용</b>으로 바꿔 주세요.</p>`};
  if(/invalid_client|unauthorized_client|origin|redirect_uri/i.test(t+' '+(e?.message||''))) return {short:'구글 클라이언트 설정 오류',html:`<p><b>구글 OAuth 클라이언트 설정 문제입니다 (${esc(t||e.message)}).</b> Google 인증 플랫폼 &gt; 클라이언트의 <b>승인된 JavaScript 원본</b>에 <code>${esc(location.origin)}</code> 이 정확히(끝에 / 없이) 들어 있는지 확인하세요. 바꾼 뒤 반영까지 몇 분 걸릴 수 있습니다.</p>`};
  return null;
}
function gdFail(e,interactive){
  console.warn('drive',e);
  const info=gdErrInfo(e);
  if(info||['immediate_failed','interaction_required'].includes(e.type)){
    gdSet('reconnect',info?info.short:SV_ON?(e.message||SV_NEED_LOGIN):(e.message||'')+' — 상단의 [☁ 다시 연결]을 한 번 눌러 주세요');
    if(info&&interactive) gdHelpModal(info.html);
  } else gdSet('error',e.message||String(e));
}

// API 키 비교: 드라이브에만 있는 키는 이 PC로 가져오고, 이 PC에만 있거나 다른 키가 있으면 드라이브에 저장 필요
function gdKeyDiff(d){
  const R={}; ((d&&d.settings&&d.settings.accounts)||[]).forEach(a=>{ if(a&&a.id&&a.key) R[a.id]=a.key; });
  let pulled=0, push=false;
  for(const a of accounts()){ if(!a.key && R[a.id]){ a.key=R[a.id]; pulled++; } else if(a.key && R[a.id]!==a.key) push=true; }
  return {pulled, push};
}
async function gdConnect(interactive){
  if(!interactive && !gdHasTok()){ gdSet('reconnect',SV_ON?SV_NEED_LOGIN:GD_NEED_LOGIN); return; } // 페이지를 열 때 로그인 창을 자동으로 띄우지 않음
  gdSet('connecting', SV_ON?'서버 확인 중…':interactive&&!gdHasTok()?'구글 로그인 창에서 계정을 선택하고 허용해 주세요 ("확인하지 않은 앱" 화면이면 [계속])':'드라이브 확인 중…');
  gd.ia=!!interactive;
  try{
    await gdToken(!!interactive);
    gdSet('connecting',SV_ON?'서버 확인 중…':'드라이브 확인 중…');
    gdMeta.on=true; gdSaveMeta();
    const f=await gdFind(); gd.fileId=f?.id||null;
    if(!f){ if(SV_ON){ gd.remoteRev=0; gdMeta.rev=0; }
      if(gdLocalEmpty()){ gdSet('on',(SV_ON?'서버':'드라이브')+'에 아직 데이터가 없습니다. 캐릭터를 추가하면 자동 저장됩니다'); return; }
      await gdWrite(); gdSet('on','이 PC 데이터를 '+(SV_ON?'서버':'드라이브')+'에 처음 저장했습니다'); return; }
    gd.busy=true; let res;
    try{ res=await gdSync(await gdRead(f.id)); if(SV_ON) svAfterLogin(); } finally{ gd.busy=false; }
    if(res!=='ask'){ gdSet('on',GD_RES_MSG[res]||''); if(res==='loaded') toast('☁ '+GD_RES_MSG.loaded); }
    if(gd.again){ gd.again=false; gdChanged(); }
