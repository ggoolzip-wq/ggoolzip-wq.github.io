<style>
:root{
  --bg:#fbf6f0;--panel:#ffffff;--panel2:#fff8f0;--text:#2b2118;--muted:#8a7765;--line:#eadfd2;
  --accent:#f28c28;--accent2:#e0701a;--accent-soft:#fff0e0;--ok:#2fa36b;--warn:#d9534f;
  --shadow:0 2px 10px rgba(120,70,20,.08);--r:14px;
}
[data-theme="dark"]{
  --bg:#17130f;--panel:#221c17;--panel2:#2a221b;--text:#f3e9df;--muted:#a8978a;--line:#3a3028;
  --accent:#ff9a3c;--accent2:#ffb066;--accent-soft:#3a2a1a;--shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--shadow)}
.hwrap{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-weight:800;font-size:1.15rem;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.logo .leaf{width:26px;height:26px}
.hspace{flex:1}
.hbtn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.3)}
nav.tabs{max-width:1200px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto}
nav.tabs button{background:none;border:none;color:rgba(255,255,255,.85);padding:8px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:600}
nav.tabs button.on{color:#fff;border-bottom-color:#fff}
main{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:270px 1fr;gap:16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.card h2{margin:0 0 10px;font-size:1.02rem;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:.86rem}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{padding:4px 8px;font-size:.82rem;border-radius:8px}
.btn.danger{background:var(--warn)}
.btn.plain{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.chars{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.char{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.char.on{border-color:var(--accent);background:var(--accent-soft)}
.char .nm{font-weight:700}
.char .meta{font-size:.8rem;color:var(--muted)}
.char .grow{flex:1;min-width:0}
.char .rev{font-size:.8rem;color:var(--accent);font-weight:700;white-space:nowrap}
.empty{text-align:center;padding:36px 16px}
.empty .big{font-size:2.6rem}
.grid{display:grid;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{font-size:.8rem;color:var(--muted)}
.stat .v{font-size:1.2rem;font-weight:800;margin-top:2px}
.stat .v.acc{color:var(--accent)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--warn)}
.sec-title{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-weight:800}
.pill{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.boss-list{display:flex;flex-direction:column;gap:6px}
.boss{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.boss.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel2))}
.boss .bn{font-weight:700}
.boss .grow{flex:1;min-width:0}
.diffs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.diff{font-size:.78rem;padding:3px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;user-select:none}
.diff.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.diff.locked{opacity:.4;cursor:not-allowed}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;background:var(--panel);flex:none;font-weight:900;color:#fff}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.dis{opacity:.35;cursor:not-allowed}
.party{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted)}
.party select{padding:3px 4px;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
.price{font-size:.8rem;color:var(--muted);white-space:nowrap;text-align:right;min-width:86px}
.price b{color:var(--text)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--panel);border:none;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:.8rem}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=number],select.in{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
input.pin{width:150px;text-align:right;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.note{background:var(--accent-soft);border-left:4px solid var(--accent);padding:8px 12px;border-radius:8px;font-size:.85rem}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border-radius:16px;padding:18px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{margin:0 0 12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2b2118;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.hidden{display:none!important}
.chart svg{width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px}
.chart .lbl{fill:var(--text);font-weight:700}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
.side-sticky{position:sticky;top:96px;align-self:start}
@media(max-width:820px){.side-sticky{position:static}}
.foot{max-width:1200px;margin:0 auto;padding:4px 16px 24px;color:var(--muted);font-size:.78rem}
.avatar{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);flex:none;display:grid;place-items:center;overflow:hidden;font-weight:800;color:var(--accent)}
.avatar img{width:64px;height:64px;object-fit:none;object-position:center 60%;image-rendering:auto}
.avatar.lg{width:64px;height:64px;border-radius:14px}
.avatar.lg img{width:96px;height:96px}
.mainbadge{font-size:.68rem;background:var(--accent);color:#fff;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.world-h{font-size:.76rem;color:var(--muted);font-weight:700;margin:8px 2px 0}
.pill.api{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.err{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.apibox{display:flex;flex-direction:column;gap:6px}
.apibox .btn{width:100%}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.keyrow{display:flex;gap:6px}
.keyrow input{flex:1}
.imp-list{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:4px;margin:8px 0}
.imp-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer}
.imp-item.dis{opacity:.5;cursor:default}
.imp-item input{width:18px;height:18px;accent-color:var(--accent)}
.modal.wide{max-width:520px}
.checkline{display:flex;align-items:center;gap:8px;font-size:.9rem}
.checkline input{width:18px;height:18px;accent-color:var(--accent)}
code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:.85em}
.char .grow .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{grid-template-columns:300px 1fr}
@media(max-width:820px){main{grid-template-columns:1fr}}
.bicon{width:28px;height:28px;border-radius:8px;object-fit:cover;flex:none;display:inline-grid;place-items:center;vertical-align:middle;margin-right:8px;box-shadow:0 0 0 1px var(--line)}
.bicon.fb{background:linear-gradient(135deg,hsl(var(--h) 55% 55%),hsl(calc(var(--h) + 40) 55% 40%));color:#fff;font-weight:800;font-size:.85rem;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.boss .bn{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.boss .bn .bicon{width:34px;height:34px;margin-right:6px}
.bname{display:inline-flex;align-items:center;gap:2px}
.bname .bicon{width:24px;height:24px;border-radius:6px}
.drag-h{cursor:grab;color:var(--muted);font-size:1rem;line-height:1;padding:4px 2px;user-select:none;touch-action:none;flex:none}
.char{position:relative}
.char.dragging,.world-h.dragging{opacity:.4}
.drop-before{box-shadow:inset 0 3px 0 var(--accent)!important}
.drop-after{box-shadow:inset 0 -3px 0 var(--accent)!important}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none}
.ordcol{display:flex;flex-direction:column;gap:2px}
.ord{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:5px;font-size:.55rem;line-height:1;padding:2px 4px;cursor:pointer}
.ord:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.ord:disabled{opacity:.3;cursor:default}
.world-h{display:flex;align-items:center;gap:4px;padding:2px 0;border-radius:6px}
.world-h .ord{font-size:.5rem}
.accb{display:inline-block;font-size:.66rem;font-weight:700;padding:0 5px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);vertical-align:1px}
.accb.warn{color:var(--warn);border-color:var(--warn)}
.acc-row{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:8px}
.acc-line{display:flex;gap:6px;align-items:center;font-size:.8rem}

/* EXP 표시 (사이드바 카드, 아주 작게) */
.char .nm{line-height:1.2}
.char .meta{line-height:1.25}
.expl{display:flex;align-items:center;gap:5px;height:9px;margin-top:2px}
.expbar{flex:1;max-width:120px;height:3px;border-radius:2px;background:rgba(127,127,127,.22);overflow:hidden}
.expbar>i{display:block;height:100%;background:#9BE84A;border-radius:2px;box-shadow:0 0 4px rgba(155,232,74,.55)}
[data-theme=light] .expbar>i{background:#7ED321;box-shadow:none}
.exppct{font-size:.62rem;line-height:9px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 보스 체크 탭: 본문 + 오른쪽 수익 패널 */
main{max-width:1480px}
.bosslay{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
.rcol{position:sticky;top:110px;display:flex;flex-direction:column;gap:12px;height:calc(100vh - 172px);max-height:calc(100vh - 172px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.rcol>.card{margin:0}
@media(max-width:1180px){.bosslay{grid-template-columns:1fr}.rcol{position:static;height:auto;max-height:none;overflow:visible}}
.rp-total{font-size:1.5rem;font-weight:800;color:var(--accent);margin:6px 0 2px;line-height:1.2}
.rp-total small{font-size:.8rem;font-weight:600;color:var(--muted)}
.rp-sec{font-size:.78rem;font-weight:700;margin:14px 0 6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rp-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem}
.rp-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-list{display:flex;flex-direction:column;gap:4px}
.rp-char{padding:6px 8px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.rp-char:hover{background:var(--panel2)}
.rp-char.on{border-color:var(--accent);background:var(--accent-soft)}
.rp-char b{font-size:.82rem;white-space:nowrap}
.mini{flex:1;height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.mini>i{display:block;height:100%;background:var(--accent)}
.warnc{color:var(--warn)}
/* 가격 출처 표시 */
.src{display:inline-block;font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.src.off{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.src.est{background:color-mix(in srgb,#8a8fa3 22%,transparent);color:var(--muted)}
.src.mine{background:var(--accent-soft);color:var(--accent)}
/* 희귀 드롭 */
.drops{display:flex;flex-wrap:nowrap;gap:4px;margin-top:5px;min-width:0;overflow:hidden}
.drop{display:inline-flex;align-items:center;gap:4px;flex:0 1 auto;min-width:0;font-size:.72rem;padding:1px 7px 1px 2px;border-radius:7px;border:1px solid var(--line);background:var(--panel);line-height:1.2;max-width:100%}
.drop img,.drop .ifb{width:26px;height:26px;flex:none;object-fit:contain;image-rendering:auto}
.drop .ifb{display:grid;place-items:center;border-radius:6px;background:var(--line);font-weight:800;font-size:.75rem;color:var(--muted)}
.drop .dn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop.s-광휘{border-color:#e7b93c;background:color-mix(in srgb,#e7b93c 12%,var(--panel))}
.drop.s-칠흑{border-color:#8a63d2;background:color-mix(in srgb,#8a63d2 10%,var(--panel))}
.drop.s-여명{border-color:#5aa9e6;background:color-mix(in srgb,#5aa9e6 10%,var(--panel))}
.drop.s-해머{border-color:#d97a3a}
.drop.s-연마석{border-color:#9aa7b8}
.drop.s-에테르{border-color:#b06ad8;background:color-mix(in srgb,#b06ad8 8%,var(--panel))}
/* 솔 에르다의 기운: 정보 표시 전용 — 아이콘 왼쪽 위에 개수 배지 */
.drop.erda{position:relative;flex:none;padding:1px 2px;cursor:default;border-style:dashed;background:color-mix(in srgb,#46b6c9 8%,var(--panel))}
.drop.erda .ecnt{position:absolute;top:-3px;left:-3px;min-width:15px;padding:0 3px;border-radius:8px;background:#2b8fa3;color:#fff;font-size:.6rem;font-weight:800;line-height:13px;text-align:center;box-shadow:0 0 0 1px var(--panel);pointer-events:none}
.drops{padding-top:3px;padding-left:3px}
@media(max-width:560px){.drop .dn{max-width:9em}}
/* 사이드바 카드: 이름 한 줄 유지, 좁은 화면 가로 넘침 방지 */
main{grid-template-columns:320px minmax(0,1fr)}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
main>*{min-width:0}
.char .grow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char .grow .nm .mainbadge{vertical-align:1px}
.bosslay>*,.grid>*{min-width:0}
.hwrap,nav.tabs{max-width:1480px}
.foot{max-width:1480px}

.impmsg{font-size:.86rem;line-height:1.5;padding:8px 10px;border-radius:10px;margin:6px 0;background:var(--panel2);border:1px solid var(--line)}
.impmsg:empty{display:none}
.impmsg.ok{border-color:color-mix(in srgb,#9BE84A 45%,var(--line))}
.impmsg.warn{border-color:#e0a020;background:color-mix(in srgb,#e0a020 12%,var(--panel2))}
.impmsg.err{border-color:#e5484d;background:color-mix(in srgb,#e5484d 12%,var(--panel2))}
.impmsg ul{margin:6px 0 6px 18px;padding:0}.impmsg li{margin:2px 0}
.impmsg .errcode{font-family:ui-monospace,Consolas,monospace;font-weight:700;margin:4px 0}
.impmsg code{font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.impmsg .toolbar{margin-top:6px}
.pick-list{max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.pick-item{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;text-align:left;padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:inherit;cursor:pointer;font:inherit}
.pick-item:hover:not(:disabled){border-color:var(--accent)}
.pick-item.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pick-item:disabled{opacity:.5;cursor:default}
.pick-item .muted{font-size:.78rem}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit;font-size:.8rem;text-decoration:underline}
/* 사이드바 카드: 레벨은 항상 전부 보이고 직업만 말줄임 */
.char .meta.lvrow{display:flex;gap:5px;min-width:0;white-space:nowrap;font-size:.76rem}
.char .meta.lvrow .lv{flex:none;font-weight:700;color:var(--text);opacity:.85}
.char .meta.lvrow .job{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.char .grow .nm{font-size:.92rem}
.char .grow .nm .mainbadge{font-size:.62rem;padding:0 4px}
.char .rev{font-size:.76rem}
.warnc{color:var(--warn)}
.mmeso{font-size:.78rem;font-weight:600;color:var(--accent);white-space:nowrap}
.rp-month{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:8px 0 2px;padding:7px 9px;border:1px dashed var(--line);border-radius:9px;font-size:.8rem}
.rp-month b{white-space:nowrap}

.drop.s-반지{border-color:#3fae8a;background:color-mix(in srgb,#3fae8a 10%,var(--panel))}
.drop.more{flex:none;padding-right:6px;cursor:help}
.drop.more img,.drop.more .ifb{width:20px;height:20px;margin-right:-6px}
.drop.more .dn{margin-left:6px;font-weight:700}
.stats.s4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1500px){.bosslay .stats.s4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.stats.s4{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 드롭 획득 수량 */
.drop[data-drop],.drop[data-dropmore]{cursor:pointer;user-select:none}
.drop[data-drop]:hover{filter:brightness(1.04);box-shadow:0 0 0 1px var(--accent) inset}
.drop.got{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel));box-shadow:0 0 0 1px var(--accent) inset}
.drop .dcnt{flex:none;font-size:.72rem;color:var(--accent);font-weight:800}
.drop .ddec{flex:none;display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-size:.75rem;line-height:1;color:var(--muted);margin-left:1px}
.drop .ddec:hover{color:var(--warn);border-color:var(--warn)}
.drops.open{flex-wrap:wrap}
.itl{display:inline-flex;flex-wrap:wrap;gap:3px 6px;vertical-align:middle}
.iti{display:inline-flex;align-items:center;gap:2px;font-size:.72rem}
.iti img,.iti .ifb{width:18px;height:18px;object-fit:contain}
.iti b{color:var(--accent);font-weight:800}
.iti .itn{color:var(--muted)}
.rp-items{margin-top:3px}
.hitems{font-size:.76rem;margin-top:3px}
.hitems>b{font-weight:700;margin-right:4px}
.scrollx{overflow-x:auto}

/* 반지 상자 결과 */
.ringouts{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px;font-size:.72rem}
.rline{display:inline-flex;align-items:center;gap:3px}
.rline img,.rline .ifb{width:16px;height:16px;object-fit:contain}
.routs{display:inline-flex;align-items:center;flex-wrap:wrap;gap:0 1px;margin-left:3px;font-size:.7rem}
.ro{display:inline-flex;align-items:center;gap:1px;font-weight:700;white-space:nowrap}
.ro-r4,.ro-c4{color:#d6336c}
.ro-x{color:var(--muted);font-weight:600}
.ro-un{color:var(--muted);font-weight:500;font-style:italic}
.rsep{color:var(--muted);font-weight:400}
img.ric{width:16px;height:16px;object-fit:contain;image-rendering:pixelated}
.ringsum{font-size:.82rem;margin-bottom:10px;padding:8px 10px;border-radius:10px;border:1px dashed var(--line)}
.ringsum img.ric{width:18px;height:18px}
.ringm{position:relative;max-width:420px}
.ringx{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;font-size:.9rem}
.ringx:hover{color:var(--text)}
.ringhead{display:flex;gap:10px;align-items:center;margin:0 30px 12px 0}
.ringhead h3{margin:0}
.ringbox img,.ringbox .ifb{width:40px;height:40px;object-fit:contain}
.ringchoices{display:flex;flex-direction:column;gap:8px}
.ringc{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;text-align:left}
.ringc:hover,.ringc:focus-visible{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.ringc.r4:hover,.ringc.c4:hover{background:color-mix(in srgb,#ff8fab 12%,var(--panel2))}
.ringico{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.ringico img.ric{width:40px;height:40px}
.ricx{font-size:1.2rem;color:var(--muted)}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:200;display:none}
#fx.show{display:block}
#congrats{position:fixed;inset:0;z-index:201;display:none;place-items:center;background:rgba(0,0,0,.18);cursor:pointer}
#congrats.show{display:grid;animation:cgfade 2.7s ease forwards}
.cg-in{text-align:center;padding:22px 30px;border-radius:20px;background:color-mix(in srgb,var(--panel) 92%,transparent);box-shadow:0 10px 40px rgba(0,0,0,.25);animation:cgpop .5s cubic-bezier(.2,1.6,.4,1)}
.cg-in img.ric{width:64px;height:64px}
.cg-big{font-size:2.4rem;font-weight:900;background:linear-gradient(90deg,#ff5a5f,#ffb400,#a66cff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.cg-sub{font-weight:700;margin-top:4px}
@keyframes cgpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes cgfade{0%,80%{opacity:1}100%{opacity:0}}
@media(max-width:480px){.cg-big{font-size:1.8rem}}

#priceModal .modal,#driveModal .modal{position:relative}
.pmnotes{font-size:.8rem;margin:8px 0;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.pmhead{display:flex;align-items:center;gap:8px;margin:8px 0 4px}
.pmlist{max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.pmrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:6px 9px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer}
.pmrow input{width:18px;height:18px;accent-color:var(--accent)}
.pmrow .bname{flex:1 1 160px;min-width:0}
.pmprice{white-space:nowrap;font-size:.85rem}
.pmtags{display:flex;gap:4px;flex-wrap:wrap}
.pmun{margin-top:8px;font-size:.8rem}

.hbtn.gbtn{margin-right:6px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.hbtn.gbtn.warn{background:#fff;color:var(--warn);border-color:#fff;font-weight:700}
.gdline{margin-bottom:2px}
.gdconf{margin:4px 0 8px;padding-left:18px;font-size:.85rem}.gdconf li{margin:2px 0}
.gdsides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.gdside{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--panel2)}
.gdside.newer{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.gdside .gdt{font-weight:800;margin-bottom:2px}
.gdside .btn{margin-top:8px}
@media (max-width:520px){.gdsides{grid-template-columns:1fr}}

.gdhelp{font-size:.88rem;line-height:1.55}.gdhelp ul{padding-left:18px;margin:6px 0}.gdhelp li{margin:6px 0}
/* 파티 분배 획득 표시 */
.iti .itn.pn{font-size:.68rem;color:var(--muted);font-weight:700;white-space:nowrap}
.rline.pty .muted{color:var(--text);opacity:.85}
/* 획득 아이템 줄 (모든 화면 공통) */
.dls{display:inline-flex;flex-wrap:wrap;gap:3px 12px;vertical-align:middle;font-size:.74rem}
.dl{display:inline-block;min-width:0;line-height:1.45}
.dl .dlt{display:inline}
.dl .dlt>img,.dl .dlt>.ifb{width:18px;height:18px;object-fit:contain;vertical-align:-4px;margin-right:3px;display:inline-block}
.dl .routs{display:inline}
.dl .dlb{margin-right:5px;vertical-align:1px}
.dl .dln{color:var(--text)}
.dl .dlc{color:var(--accent);font-weight:800}
.dl .dlb{font-size:.66rem;font-weight:700;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 5px;white-space:nowrap}
.rp-items .dls{display:flex;flex-direction:column;gap:3px}
.hitems .dls{gap:3px 14px}

/* 보스 체크 탭: 결정석 가격 카드 (읽기 전용) */
.pricecard{padding:12px 14px}
.pricecard .pc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pricecard .pc-head h2{margin:0;font-size:.95rem}
.pricecard .linkbtn{font-size:.72rem}
.pc-list{max-height:260px;overflow-y:auto;scrollbar-width:thin;margin:0 -4px;padding:0 4px}
.pc-row{display:flex;align-items:center;gap:6px;font-size:.72rem;padding:2px 0;border-bottom:1px dashed var(--line)}
.pc-row:last-child{border-bottom:0}
.pc-row .bicon,.pc-row .bfb{width:18px;height:18px;border-radius:5px;flex:none}
.pc-row .pc-nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-row b{white-space:nowrap;font-weight:700}
.pc-row.custom b{color:var(--accent)}
.pc-sep{font-size:.68rem;font-weight:700;color:var(--muted);margin:6px 0 2px}
.pc-foot{font-size:.64rem;margin-top:6px}
.pc-head h2 .ric{width:22px;height:22px;vertical-align:-5px;margin-right:2px}
/* 주간 보스 12/12 완료 덮개 (마우스를 올리면 사라짐, 클릭·드래그는 통과) */
.char .dov{position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:3;opacity:1;transition:opacity .15s ease;padding:4px 8px}
.char .dov-t{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;line-height:1.2;max-width:100%;
  color:#fff;font-weight:800;font-size:.82rem;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.char .dov-ok,.char .dov-warn{white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.char .dov-star{color:#ffd23f;font-weight:900}
.char .dov-warn{color:#ff5a5a;font-size:.74rem}
.char .dov-ex{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border:1.6px solid #ff5a5a;border-radius:50%;
  font-style:normal;font-size:10px;font-weight:900;line-height:1;box-sizing:border-box}
@media(hover:hover){.char:hover .dov{opacity:0}}
.optlines{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.dangerzone{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:.88rem}

@media(max-width:520px){.dangerzone{flex-direction:column;align-items:flex-start}}

.hbtn.sbtn{white-space:nowrap;display:inline-flex;align-items:center;gap:4px}

.gwrap{position:relative}
.gwrap .hbtn.gbtn{margin-right:0}
.gmenu{position:absolute;right:0;top:calc(100% + 8px);width:340px;max-width:calc(100vw - 20px);background:var(--panel);color:var(--text);border:1px solid var(--line);

.optlines.compact{margin-top:8px;padding-top:8px;font-size:.84rem;gap:4px}
.optlines.compact .checkline{font-size:.84rem}

.addm .row{display:flex;align-items:center;gap:10px}

@media(max-width:400px){.hbtn.sbtn .hl{display:none}}
.hbtn[hidden]{display:none!important}
.logo .leaf.mush{width:34px;height:34px;padding:3px;box-sizing:border-box;background:#fff8ef;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.18);image-rendering:auto}
/* ---- 상단 탭: '총 수익' 뒤 짧은 ㅡ 구분선 ---- */
nav.tabs .tabsep{flex:none;align-self:center;width:14px;height:2px;border-radius:2px;background:rgba(255,255,255,.6);margin:0 6px}
/* ---- 일퀘 현황 ---- */
.dqtop{margin-bottom:12px}
.dqtop h2{flex-wrap:wrap;margin:0}
.dqstat{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.dqspin{width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sbspin .8s linear infinite}
.dqedit{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.dqchips{display:flex;flex-wrap:wrap;gap:6px}
.dqchip{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700;cursor:pointer;text-decoration:line-through}
.dqchip.on{color:var(--text);text-decoration:none;border-color:var(--c);box-shadow:inset 3px 0 0 var(--c)}
.dqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.dqc{padding:12px}
.dqc.hid{opacity:.45}
.dqh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.dqh .avatar{width:36px;height:36px}
.dqh .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dqh .meta{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dqh .grow{flex:1;min-width:0}
.dqcnt{font-size:.78rem;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.dqcnt.full{background:var(--ok);border-color:var(--ok);color:#fff}
.dqeye{padding:3px 8px;font-size:.78rem}
.dqcells{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.dqi{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:7px 8px 6px 11px;min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.dqi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.dqn{font-size:.82rem;font-weight:800;word-break:keep-all;overflow-wrap:anywhere;line-height:1.2}
.dqs{font-size:.72rem;color:var(--muted);white-space:nowrap;line-height:1.2}
.dqs em{font-style:normal;font-weight:700}
.dqi.s-prog .dqs{color:var(--accent);font-weight:700}
.dqi.s-done .dqs{color:var(--ok);font-weight:700}
.dqi.s-none{opacity:.55}
.dqi.off{opacity:.4;border-style:dashed}
.dqi.off .dqn{text-decoration:line-through}
.dqi[data-dqc]{cursor:pointer}
.dqi[data-dqc]:hover{border-color:var(--accent)}
/* 완료 덮개: 주간 보스 완료 덮개와 같은 처리 (rgba 0,0,0,.55 · 마우스를 올리면 사라짐 · 클릭 통과) */
.dqov{position:absolute;inset:0;border-radius:inherit;background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:#fff;font-weight:800;font-size:.8rem;line-height:1.2;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;opacity:1;transition:opacity .15s ease;z-index:2;padding:2px 4px}
.dqov-n{font-size:.78rem;word-break:keep-all}
.dqov-t{font-size:.72rem}
.dqov-t b{color:#7dffb0}
/* 덮개가 있을 때는 원래 글자를 숨겨 겹치지 않게 (마우스를 올리면 덮개가 사라지고 원래 칸이 보임) */
.dqi.s-done>.dqn,.dqi.s-done>.dqs{opacity:0;transition:opacity .15s ease}
@media(hover:hover){.dqi:hover .dqov{opacity:0}.dqi.s-done:hover>.dqn,.dqi.s-done:hover>.dqs{opacity:1}}
.dqlock{font-size:.74rem;margin-top:8px}
.dqmsg{font-size:.84rem;padding:6px 2px}
.dqfoot{margin:10px 2px 0}
@media(max-width:520px){.dqgrid{grid-template-columns:1fr}.dqcells{grid-template-columns:repeat(3,minmax(0,1fr))}.dqtop h2 .dqstat{order:5;width:100%}}
/* ---- 길드 현황 ---- */
.gcard h2{flex-wrap:wrap}
.gmeta{display:flex;align-items:center;gap:10px;font-size:.88rem;margin-bottom:10px}
.glv{background:var(--accent);color:#fff;font-weight:800;border-radius:8px;padding:2px 8px;font-size:.8rem}
.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gtile{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px 14px}
.gk{font-size:.82rem;color:var(--muted);font-weight:700}
.gv{font-size:1.45rem;font-weight:900;margin-top:4px;letter-spacing:-.01em}
.gv small{font-size:.8rem;font-weight:700;color:var(--muted);margin-left:2px}
.gv.dim{font-size:1rem;color:var(--muted)}
.grk{font-size:.86rem;margin-top:2px}
.grk b{color:var(--accent);font-size:1.05rem}
.grow-r{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.grow-r:last-of-type{border-bottom:0}
.grow-r .grow{flex:1;min-width:0}
.grow-r .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow-r .meta{font-size:.78rem;color:var(--muted)}
.gsc{display:flex;flex-direction:column;align-items:flex-end;min-width:64px}
.gsc b{font-size:.95rem;white-space:nowrap}
.gsc b small{font-size:.72rem;color:var(--muted);font-weight:600}
.gsc.main b{font-size:1.15rem;color:var(--accent)}
@media(max-width:520px){.gv{font-size:1.2rem}.grow-r{flex-wrap:wrap}.grow-r .grow{flex-basis:calc(100% - 50px)}.gsc{min-width:0;flex:1;align-items:flex-start}}
/* 일퀘 칸 지역 아이콘 (이름 왼쪽 20px, 덮개 안에서는 살짝 어둡게) */
.dqn{display:flex;align-items:center;gap:4px;min-width:0}
.dqn>span{min-width:0}
.dqico{width:20px;height:20px;object-fit:contain;flex:none;image-rendering:auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.dqov-n{display:inline-flex;align-items:center;gap:4px}
.dqov-n .dqico.ov{width:18px;height:18px;opacity:.85}
.dqi{padding-left:9px}
@media(max-width:520px){.dqico{width:18px;height:18px}.dqn{gap:3px}}
/* 일퀘 칸: 모든 상태에서 아이콘+지역명·상태 줄 가운데 정렬 (완료 덮개와 같은 정렬) */
.dqi{align-items:center;text-align:center;padding:7px 6px 6px 9px}
.dqn{justify-content:center;max-width:100%}
.dqs{text-align:center}

/* 소식 피드 카드 (왼쪽 아래) — 높이는 JS(feedFit)가 남은 화면 높이로 맞춤, 안쪽 스크롤 없음 */
.feedcard{display:flex;flex-direction:column;padding:10px 10px 8px;overflow:hidden;min-height:0}
.ftabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex:none}
.ftab{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:3px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);font:inherit;font-size:.8rem;font-weight:600;padding:5px 3px 6px;cursor:pointer;white-space:nowrap}
.ftab:hover{color:var(--text)}
.ftab.on{color:var(--accent);border-bottom-color:var(--accent)}
.fcnt{min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--warn);color:#fff;font-size:.64rem;line-height:15px;font-weight:700;box-sizing:border-box;text-align:center}
.fnote{flex:none;font-size:.72rem;color:var(--muted);padding:4px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help}
.fbody{flex:1 1 auto;min-height:0;overflow:hidden;padding-top:3px}
.flist{list-style:none;margin:0;padding:0}
.flist li{height:31px}
.fit{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px;border-radius:8px;color:var(--text);text-decoration:none;font-size:.84rem}
.fit:hover{background:var(--panel2)}
.ftt{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fdt{flex:none;color:var(--muted);font-size:.74rem;font-variant-numeric:tabular-nums}
.fend{flex:none;color:var(--accent);font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}
.fnew{flex:none;width:15px;height:15px;border-radius:4px;background:var(--warn);color:#fff;font-size:.62rem;font-weight:800;line-height:15px;text-align:center}
.fit.exp{opacity:.45}
.fit.exp .fend{color:var(--muted);font-weight:600;text-decoration:line-through}
.fempty{color:var(--muted);font-size:.82rem;padding:10px 4px}
.fpager{flex:none;display:flex;justify-content:center;gap:3px;min-height:26px;align-items:center;padding-top:4px}
.fpg{min-width:24px;height:22px;padding:0 5px;border-radius:6px;border:1px solid transparent;background:none;color:var(--muted);font:inherit;font-size:.76rem;cursor:pointer;font-variant-numeric:tabular-nums}
.fpg:hover:not(:disabled){color:var(--text);border-color:var(--line)}
.fpg.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.fpg:disabled{opacity:.35;cursor:default}
/* 썬데이 메이플 카드 (소식 카드 아래) — 높이는 feedFit 이 소식 카드와 1:2 로 나눔 */
.stab{cursor:default}
.stab:hover{color:var(--accent)}
.sunico{width:15px;height:15px;flex:none;color:#f5c518;filter:drop-shadow(0 0 2px rgba(245,197,24,.45))}
.sunbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:4px;padding-top:6px}
.sunimg{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden;background:linear-gradient(180deg,rgba(245,197,24,.10),rgba(245,197,24,.03));border:0;padding:0;cursor:zoom-in;width:100%}
.sunimg img{width:100%;height:100%;object-fit:contain;display:block}
.sunimg:hover,.sunimg:focus-visible{outline:2px solid rgba(245,197,24,.6);outline-offset:-2px}
.suncap{flex:none;display:flex;gap:6px;align-items:center;font-size:.76rem;color:var(--muted);padding:0 2px}
.suncap .ftt{color:var(--text);font-weight:600}
.suncard.tight .suncap{display:none}
.sunben{flex:none;display:flex;gap:6px;align-items:flex-start;font-size:.78rem;padding:5px 8px;border-radius:8px;background:rgba(245,197,24,.14);color:var(--text);min-width:0}
.sunben b{flex:none;color:#d9a400;font-size:.7rem;font-weight:800;line-height:1.45}
.sunben ul{list-style:none;margin:0;padding:0;min-width:0;flex:1 1 auto}
.sunben li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;line-height:1.45}
.sunlb{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.sunlb-in{position:relative;display:flex;flex-direction:column;max-width:min(94vw,900px);max-height:calc(100vh - 32px);background:var(--panel,#1c1c1f);border-radius:12px;padding:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.sunlb-sc{flex:1 1 auto;min-height:0;overflow:auto;display:flex;justify-content:center;border-radius:8px}
.sunlb-sc img{display:block;max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;cursor:zoom-in}
.sunlb.zoom .sunlb-sc{align-items:flex-start}
.sunlb.zoom .sunlb-sc img{max-height:none;width:min(876px,100%);cursor:zoom-out}
.sunlb-x{position:absolute;top:-12px;right:-12px;width:34px;height:34px;border-radius:50%;border:none;background:#f5c518;color:#222;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:1}
.sunlb-bar{flex:none;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 4px 0;font-size:.82rem;color:var(--text,#eee)}
.sunlb-t{display:inline-flex;gap:6px;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.sunlb-t small{color:var(--muted);font-weight:500}
.sunlb-bar a{flex:none;color:var(--accent);font-weight:700;text-decoration:none}
.sunlb-bar a:hover{text-decoration:underline}
html.sunlb-open{overflow:hidden}
@media(max-width:600px){.sunlb{padding:8px}.sunlb-in{max-width:100%;max-height:calc(100vh - 16px);padding:8px}.sunlb-x{top:4px;right:4px}.sunlb-sc img{max-height:calc(100vh - 80px)}}
.sunempty{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:.8rem;text-align:center;border:1px dashed var(--line);border-radius:8px;min-height:80px}
.sunempty .sunico{width:30px;height:30px;opacity:.75}
@media(max-width:820px){
  #sunCard{order:3}
  #sunCard .sunimg{height:min(70vh,520px);flex:none}
  /* 모바일: 피드는 본문 아래로 자연스럽게 */
  .side-sticky{display:contents}
  .side-sticky>.card{margin-top:0!important}
  #feedCard{order:2}
}

/* 이번 주 보스를 아직 안 잡은 캐릭터: 예상 주간 수익 (강렬한 힘의 결정 아이콘) */
.expinc{display:inline-flex;align-items:center;gap:3px;margin-left:4px;padding:0 7px 0 3px;border-radius:999px;border:1px solid var(--line);background:var(--accent-soft);color:var(--text);font-size:.8rem;white-space:nowrap;vertical-align:middle}
.expinc .ric{width:18px;height:18px}
.expinc b{color:var(--accent)}
.expinc small{color:var(--muted);font-size:.7rem}

/* 오른쪽 열: 수익 · 결정석 가격 · 초기화까지(맨 아래). 화면 높이 안에 맞추고 넘치면 가격 목록(그다음 수익 패널)이 안에서 스크롤 → 초기화 카드는 항상 보임 */
/* 오른쪽 열 = 화면 높이 고정(sticky, 100vh − 위 108px − 아래 안내문/여백 58px − 6px → 내용이 짧아도 페이지 스크롤 안 생김): 수익 패널(위) · 결정석 가격(남는 높이 전부, 안에서 스크롤) · 초기화까지(맨 아래).
 * 결정석 가격 목록이 약 16줄(카드 ≈ 440px)을 먼저 확보하도록 수익 패널 최대 높이 = 남은 높이 − 440px − 초기화 카드·간격(≈124px), 최소 170px → 1920x1080 17줄, 1280x800 11줄 (2026-10-10 사용자 요청: 가격 카드가 2줄만 보이던 것) */
.rcol>.revpanel{flex:0 0 auto;max-height:max(170px,calc(100vh - 172px - 564px));overflow-y:auto;scrollbar-width:thin}
.rcol>.pricecard{flex:1 1 0;min-height:110px;display:flex;flex-direction:column}
.rcol>.pricecard .pc-list{flex:1 1 auto;min-height:40px;max-height:none}
.rcol>.resetcard{flex:none;margin-top:auto;padding:10px 14px;font-size:.82rem;line-height:1.5}
@media(max-width:1180px){.rcol>.revpanel,.rcol>.pricecard{overflow:visible;max-height:none;flex:none}.rcol>.pricecard .pc-list{max-height:260px}}
/* 캐릭터 목록: 8명 넘으면 목록 안에서 스크롤 (fitCharList 가 max-height 지정) */
#charList.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:2px}
#charList.sorted .char .drag-h{visibility:hidden}
.charsort{display:inline-flex;gap:8px;margin-left:auto;padding-left:8px;white-space:nowrap}
.sortlink{all:unset;cursor:pointer;font-size:.74rem;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.sortlink.on{font-weight:800;color:var(--text);text-decoration-thickness:2px}
.sortlink:hover{color:#c95a00}
[data-theme="dark"] .sortlink:hover{color:#ff9a3c}
.sortlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
/* 월드 탭 (캐릭터 카드): 밑줄 글자 탭 'ㅣ' 구분, 활성 = 굵은 주황(다크) / 진한 주황(라이트), 마우스 올리면 주황 */
.wtabs{display:flex;align-items:center;flex-wrap:wrap;row-gap:2px;margin:2px 0 6px;font-size:.84rem}
.wtabs:empty{display:none}
.wtablist{display:inline-flex;align-items:center;flex-wrap:wrap;min-width:0}
.wtab{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:3px;padding:2px 3px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;white-space:nowrap;border-radius:4px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-user-drag:element}
.wtab .cnt{font-weight:500}
.wtab:hover{color:#c95a00}
.wtab.on{color:#c95a00;font-weight:800;text-decoration-thickness:2px}
[data-theme="dark"] .wtab:hover,[data-theme="dark"] .wtab.on{color:#ff9a3c}
.wtab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wtab .wico{width:14px;height:14px;image-rendering:pixelated;flex:none;text-decoration:none}
.wdiv{color:var(--muted);opacity:.55;padding:0 3px;user-select:none}
.wtab.dragging{opacity:.4}
.wtab.drop-before{box-shadow:-2px 0 0 var(--accent)}
.wtab.drop-after{box-shadow:2px 0 0 var(--accent)}

/* 드롭 칩 툴팁 (2026-10-10, 마우스 올림 + 터치) */
#mbtTip{position:fixed;z-index:9999;max-width:min(340px,calc(100vw - 16px));padding:8px 10px;border-radius:8px;background:#15171c;color:#eef0f4;border:1px solid #3a3f4a;box-shadow:0 6px 18px rgba(0,0,0,.45);font-size:.75rem;line-height:1.45;white-space:pre-line;pointer-events:none;opacity:0;transition:opacity .1s;left:-9999px;top:0}
#mbtTip.show{opacity:1}
#mbtTip .tth{font-weight:700;color:#fff}
.drop.eter{background:color-mix(in srgb,#b58cff 8%,var(--panel))}
.drop.eter .ecnt{background:#7d5bd6}

/* ---- 캐릭터 카드 제목 옆 🔄 동기화 아이콘 버튼 (2026-10-10: 헤더에서 이동, 글자 없이 아이콘만) ---- */
h2.charh{display:flex;align-items:center;gap:6px}
.ibtn.sbtn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border-radius:50%;border:1px solid var(--line);
  background:var(--panel2);color:var(--muted);cursor:pointer;flex:none;transition:color .15s,border-color .15s}
.ibtn.sbtn:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.ibtn.sbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ibtn.sbtn:disabled{cursor:default;color:var(--accent)}
.ibtn.sbtn .rot{display:block;width:14px;height:14px}
.ibtn.sbtn.busy .rot{animation:sbspin .9s linear infinite}
.ibtn[hidden]{display:none!important}
@media(max-width:820px){.ibtn.sbtn{width:32px;height:32px}.ibtn.sbtn .rot{width:16px;height:16px}}

/* 서버 모드 입장 화면: 빈 화면 + 가운데 상자 (초대 비밀번호 → 대표 키) */
html.gated body>*:not(#svGate):not(#toast){visibility:hidden}
#svGate{position:fixed;inset:0;z-index:9999;background:#121216;display:flex;align-items:center;justify-content:center;padding:16px;color:#ececf1}
#svGate .svgbox{width:min(380px,100%);background:#1d1d23;border:1px solid #2e2e38;border-radius:16px;padding:24px;box-shadow:0 12px 48px rgba(0,0,0,.5)}
#svGate .svgt{font-weight:800;font-size:1.2rem;margin-bottom:10px}
#svGate .svgd{font-size:.85rem;line-height:1.5;margin-bottom:14px}

.svask{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}

.pbtn{background:transparent;border:0;padding:4px 8px;font:inherit;font-size:.85rem;color:var(--muted,#8a8a96);opacity:.55;cursor:default}
.pbtn.psave{font-weight:800}
.pbtn.on{opacity:1;cursor:pointer}

.svaskbtns [data-k=yes]{background:#ff8a1f;color:#fff;border-color:#ff8a1f}

.rectab th:nth-child(3),.rectab td:nth-child(3),.rectab th:nth-child(4),.rectab td:nth-child(4){width:120px}
.totloot{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.8rem;margin-top:8px}

.cbopt{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;border:1px solid var(--line,#333);background:var(--panel2,#25252c);color:inherit;font:inherit;cursor:pointer;text-align:left}

#iconBurst img{position:absolute;left:-16px;top:-16px;width:32px;height:32px;opacity:0;will-change:transform,opacity;animation:ib 1.8s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes ib{0%{transform:translate(0,0) scale(.2) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(var(--s)) rotate(var(--r));opacity:0}}
.expinc{white-space:normal!important;max-width:100%;overflow-wrap:anywhere}.expinc small{display:inline-block}
.totloot .lx{color:#e0115f;font-weight:800}

function bossIcon(b){
  const src=BOSS_ICONS[b.id];
  if(src) return `<img class="bicon" src="${src}" alt="" aria-hidden="true">`;
  let h=0; for(const ch of b.id) h=(h*31+ch.charCodeAt(0))%360;
  return `<span class="bicon fb" style="--h:${h}" aria-hidden="true">${esc(b.name.replace(/^(선택받은|감시자|최초의|찬란한)\s*/,'').slice(0,1))}</span>`;
}

function normChar(c){ ['bosses','weekly','monthly','auto','sync','drops','mdrops','dropOut','mdropOut'].forEach(k=>c[k]=c[k]||{}); clampDropMap(c.drops,c.dropOut); clampDropMap(c.mdrops,c.mdropOut); delete c.dropParty; delete c.mdropParty; c.world=c.world||''; Object.values(c.bosses).forEach(cfg=>{ if(cfg&&typeof cfg==='object') cfg.party=Math.max(1,parseInt(cfg.party)||1); }); Object.keys(c.bosses).forEach(s=>clampParty(c,s)); } // party 는 항상 숫자 (없음/'1' 문자열이면 취소·저장 비교가 어긋났음)
// updatedAt: 데이터 내용이 '실제로' 바뀐 시각 (구글 드라이브 동기화에서 어느 쪽이 최신인지 비교)
// — 기기마다 다른 값·자동으로 계속 바뀌는 값(테마, 선택한 캐릭터, 날짜(period), 마지막 동기화 시각, 캐릭터 sync/이미지/EXP, 계정 상태)은
//   contentSig 에서 빠지므로 updatedAt 을 바꾸지 않고 드라이브 저장도 하지 않음 (2026-10-10: 이것 때문에 '어느 데이터를 쓸까요?'가 반복됐음)
let lastBody=null, lastSig=null, render0Dirty=false;
function bodyOf(){ const u=S.updatedAt; S.updatedAt=0; const b=JSON.stringify(S); S.updatedAt=u; return b; }
/* 보스 목록 [취소]/[저장]: 파티 인원 변경·드롭 클릭은 '대기 중' — 저장 전에는 수익 기록(수익 패널·캐릭터 목록·기록 탭)과 저장소에 반영 안 됨.
 * 첫 변경 직전 상태(pend.base)를 복사해 두고, 취소 = 되돌림 / 저장 = 확정(+서버 모드면 서버 저장). 나중 버튼도 pendSave() 만 부르면 됨. */
let pend=null;
// 비교용 정규화: 파티 인원 숫자화(없음·'1' → 1), 0개 드롭·빈 결과 목록 제거
function pendSig(x){ const d=JSON.parse(JSON.stringify(x)); (d.characters||[]).forEach(c=>{ normChar(c);
  for(const m of [c.drops,c.mdrops]) for(const k of Object.keys(m)) if(!(+m[k]>0)) delete m[k];
  for(const m of [c.dropOut,c.mdropOut,c.chaosOut,c.mchaosOut]) for(const k of Object.keys(m||{})) if(!Array.isArray(m[k])||!m[k].length) delete m[k]; }); return contentSig(d); }
function pendStart(){ if(!pend){ pend={base:JSON.parse(JSON.stringify(S))}; } }
const COMMITTED=fn=>{ if(!pend) return fn(); const live=S; pend.base.activeId=live.activeId; S=pend.base; try{ return fn(); } finally{ S=live; } };
const cRev=c=>COMMITTED(()=>charRevenue(S.characters.find(x=>x.id===c.id)||c));
function pendCancel(){ if(!pend) return; const keepId=S.activeId; S=pend.base; S.activeId=keepId; pend=null; save(); render(); toast('변경사항을 취소했습니다'); }
async function pendSave(){ if(!pend&&!svUnsaved()) return; pend=null; save(); render(); if(SV_ON&&svTok()&&gdMeta.on){ await svSaveNow(); render(); } else toast('저장했습니다'); }
function pendAsk(){ svAsk('변경사항을 취소하시겠습니까?',[['yes','예'],['no','아니오']]).then(k=>{ if(k==='yes') pendCancel(); }); }
function save(){
  if(pend){ if(pendSig(S)===pendSig(pend.base)) pend=null; else return; } // 대기 중: 저장소에 쓰지 않음. 되돌려서 스냅샷과 같아지면 대기 해제(버튼 비활성)
  const sig=contentSig(S), changed=sig!==lastSig;
  if(changed){ S.updatedAt=Date.now(); lastSig=sig; }
  lastBody=bodyOf();
  localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(S));
  if(changed) gdChanged();
}
const price = (b,diff) => { const k=priceKey(b,diff); return (k in S.settings.prices)?S.settings.prices[k]:(PRICE_CONFIG[k]||0); };

/* ---------- 리셋 처리 ---------- */
function resetCore(){
  const now={week:weekId(),day:dayId(),month:monthId()}; let changed=false; const msgs=[];
  if(S.period.week!==now.week){
    const sum=weekSummary(S.period.week);
    if(sum.cleared>0 && !S.history.some(h=>h.week===S.period.week)) S.history.push(sum);
    S.history.sort((a,b)=>a.week<b.week?-1:1);
    S.characters.forEach(c=>{c.weekly={}; c.drops={}; c.dropOut={}; for(const k in c.auto) if(findBoss(k)?.type==='weekly') delete c.auto[k];});
    msgs.push('주간 보스가 초기화되었습니다 (지난 주 기록 저장됨)'); changed=true;
  }
  if(S.period.month!==now.month){
    const ms=monthSummary(S.period.month); if(ms.cleared>0 && !S.monthHistory.some(h=>h.month===ms.month)) S.monthHistory.push(ms);
    S.monthHistory.sort((a,b)=>a.month<b.month?-1:1);
    S.characters.forEach(c=>{c.monthly={}; c.mdrops={}; c.mdropOut={}; for(const k in c.auto) if(findBoss(k)?.type==='monthly') delete c.auto[k];}); msgs.push('월간 보스 초기화'); changed=true; }
  if(S.period.day!==now.day) changed=true;
  if(changed) S.period=now;
  return {changed,msgs};
}

function checkResets(){ const r=resetCore(); if(r.changed){ save(); if(r.msgs.length) toast(r.msgs.join(' · ')); } return r.changed; }
// 다른 상태 객체(드라이브 데이터 등)도 지금 주·월로 넘김 (지난 주 체크 → 기록으로 보관 후 초기화) — 병합 전에 양쪽 기준을 맞춤
function rollPeriod(x){ const keep=S; try{ S=x; resetCore(); } finally{ S=keep; } return x; }

/* ---------- 클리어 수 / 수익 계산 ---------- */
const weeklyCount = c => Object.keys(c.weekly).filter(s=>findBoss(s)?.type==='weekly').length;
const monthlyCount = c => Object.keys(c.monthly).length;
/* 이번 주 클리어한 주간 보스 + 이번 달 클리어한 월간 보스. 주간 수익과 월간 수익은 따로 집계한다. */
function charCrystals(c){
  const list=[];
  for(const slot in c.bosses){
    const cfg=c.bosses[slot]; const b=findBoss(slot); if(!b||!cfg) continue;
    const ok = b.type==='weekly' ? !!c.weekly[slot] : !!c.monthly[slot];
    if(!ok) continue;
    const diff=cfg.diff, party=Math.max(1,Math.min(partyMax(b,diff),cfg.party||1));
    list.push({slot,name:b.name,type:b.type,diff,party,gross:price(b,diff),value:Math.floor(price(b,diff)/party),auto:!!c.auto[slot]});
  }
  list.sort((a,b)=>b.value-a.value);
  let w=0,m=0; list.forEach(x=>{ if(x.type==='weekly'){ x.counted = w < S.settings.weeklyLimit; w++; } else { x.counted = m < S.settings.monthlyLimit; m++; } });
  return list;
}
function charRevenue(c){ const l=charCrystals(c), sum=t=>l.filter(x=>x.type===t&&x.counted).reduce((s,x)=>s+x.value,0);
  return {list:l, wlist:l.filter(x=>x.type==='weekly'), mlist:l.filter(x=>x.type==='monthly'), weekly:weeklyCount(c), meso:sum('weekly'), monthMeso:sum('monthly')}; }
/* 아직 이번 주 주간 보스를 하나도 안 잡은 캐릭터용 '예상 주간 수익':
 * 이 캐릭터가 켜 둔(⚙ 보스 선택) 주간 보스를 지금 고른 난이도·파티 인원으로 모두 잡는다고 보고,
 * 실제 수익 계산(charCrystals)과 같은 규칙으로 1인당 결정석 가격이 높은 순 상위 12개(주간 처치 한도)를 합산. */
function expectedWeekly(c){
  const l=[];
  for(const b of BOSSES){ if(b.type!=='weekly') continue; const cfg=c.bosses[b.id]; if(!cfg?.enabled) continue;
    const diff=b.diffs.includes(cfg.diff)?cfg.diff:b.diffs[0], party=curParty(c,b.id);
    l.push({slot:b.id,name:b.name,diff,party,value:Math.floor(price(b,diff)/party)}); }
  l.sort((a,b)=>b.value-a.value); const top=l.slice(0,S.settings.weeklyLimit);
  return {list:top, all:l.length, meso:top.reduce((s,x)=>s+x.value,0)};
}
// 이번 주 남은 예상 수익: 12칸 중 아직 안 채운 칸을, 켜 둔 주간 보스 중 아직 안 잡은 것의 1인당 가격 상위로 채움 (12개 다 잡으면 빈 목록)
function remainingWeekly(c){
  const lim=S.settings.weeklyLimit, done=weeklyCount(c), left=Math.max(0,lim-done);
  const l=expectedAll(c).filter(x=>!c.weekly[x.slot]).slice(0,left);
  // 월간 보스(스케줄러에 있는 것만): 이번 달 아직 안 잡았으면 더함
  const mon=BOSSES.filter(b=>b.type==='monthly'&&c.bosses[b.id]?.enabled&&!c.monthly[b.id]).map(b=>{ const cfg=c.bosses[b.id], diff=b.diffs.includes(cfg.diff)?cfg.diff:b.diffs[0], party=curParty(c,b.id); return {slot:b.id,name:b.name,diff,party,value:Math.floor(price(b,diff)/party),monthly:true}; });
  const wm=l.reduce((s,x)=>s+x.value,0), mm=mon.reduce((s,x)=>s+x.value,0);
  return {list:l, mon, done, left, meso:wm+mm};
}
function expectedAll(c){ const l=[];
  for(const b of BOSSES){ if(b.type!=='weekly') continue; const cfg=c.bosses[b.id]; if(!cfg?.enabled) continue;
    const diff=b.diffs.includes(cfg.diff)?cfg.diff:b.diffs[0], party=curParty(c,b.id); l.push({slot:b.id,name:b.name,diff,party,value:Math.floor(price(b,diff)/party)}); }
  return l.sort((a,b)=>b.value-a.value); }
function allRevenue(){
  const per=S.characters.map(c=>({c,r:charRevenue(c)}));
  let total=0, count=0, monthTotal=0, monthCount=0;
  per.forEach(p=>{ p.r.wlist.filter(x=>x.counted).forEach(x=>{ total+=x.value; count++; }); p.r.mlist.filter(x=>x.counted).forEach(x=>{ monthTotal+=x.value; monthCount++; }); });
  return {per, total, count, monthTotal, monthCount};
}
const bossTag = x => `${x.name}(${D[x.diff]})`+(x.party>1?`/${x.party}인`:'');
// 주간 기록: 주간 보스만 (월간 보스는 monthSummary 로 따로)
/* 희귀 드롭 획득 수량 (수익에는 넣지 않음): c.drops = {'보스|아이템': 개수} (이번 주), c.mdrops = 월간 보스용 (이번 달) */
const dropMap = (c,type) => type==='monthly' ? (c.mdrops||(c.mdrops={})) : (c.drops||(c.drops={}));
const dropCount = (c,b,item) => +(dropMap(c,b.type)[b.id+'|'+item]||0);
const cleanItems = m => Object.fromEntries(Object.entries(m||{}).filter(([,n])=>+n>0).map(([k,n])=>[k,+n]));
const itemSum = m => Object.values(m||{}).reduce((s,n)=>s+(+n||0),0);
/* 반지 상자 결과: c.dropOut / c.mdropOut = {'보스|반지상자': ['r4'|'c4'|'x', ...]} (획득 순서). 개수보다 결과가 적으면 그만큼 '미기록'(기능 도입 전 획득분) */
const RING_KEYS = new Set(['r_green','r_red','r_black','r_white','r_life']);
const isRing = k => RING_KEYS.has(k);
const outMap = (c,type) => type==='monthly' ? (c.mdropOut||(c.mdropOut={})) : (c.dropOut||(c.dropOut={}));
const cleanOut = m => Object.fromEntries(Object.entries(m||{}).filter(([,a])=>Array.isArray(a)&&a.length).map(([k,a])=>[k,a.filter(o=>o==='r4'||o==='c4'||o==='gl'||o==='x'||/^cb:\w+$/.test(o))]));
const OUT_LABEL = {r4:'리4', c4:'컨4', gl:'생명의 연마석', x:'꽝'}; // gl = 생명 반지 상자에서 나온 생명의 연마석
/* 파티 인원: 이번 주/이번 달의 획득 기록은 그 캐릭터의 해당 보스 '파티 인원' 설정을 따릅니다 (드롭다운을 바꾸면 이번 기간 기록 표시도 바뀜).
 * 주간/월간 초기화로 기록에 저장될 때 키에 인원이 고정됩니다: 'boss|item'(1인) / 'boss|item#N'(N인 분배) */
const curParty = (c,slot) => { const cfg=c?.bosses?.[slot], b=findBoss(slot); return Math.max(1, Math.min(b?partyMax(b,cfg?.diff||b.diffs[0]):CONFIG.MAX_PARTY, parseInt(cfg?.party)||1)); };
const partyTxt = p => p>1 ? ` (${p}인 분배)` : '';
// 'boss|item', 'boss|item#3', 'item', 'item#2' → {slot, it, party}
function parseIK(k){ const [a,pp]=String(k).split('#'); const i=a.indexOf('|'); return {slot:i>=0?a.slice(0,i):'', it:i>=0?a.slice(i+1):a, party:Math.max(1,parseInt(pp)||1)}; }
// 이번 기간 획득 기록 → 현재 파티 인원을 붙인 키
function charDrops(c,type){
  const m=type==='monthly'?c.mdrops:c.drops, om=type==='monthly'?c.mdropOut:c.dropOut, I={}, O={};
  for(const [k,n] of Object.entries(m||{})){ if(!(+n>0)) continue; const slot=k.split('|')[0], p=curParty(c,slot), key=p>1?`${k}#${p}`:k;
    I[key]=+n; const l=(om||{})[k]; if(Array.isArray(l)&&l.length) O[key]=l.filter(o=>o==='r4'||o==='c4'||o==='gl'||o==='x'||/^cb:\w+$/.test(o)); }
  return {items:I, outcomes:O};
}
const charAllDrops = c => { const w=charDrops(c,'weekly'), m=charDrops(c,'monthly'); return {items:{...w.items,...m.items}, outcomes:{...w.outcomes,...m.outcomes}}; };
const CHAOS_PICK = ['lcm','eye','belt','book','terror','cfe','sos'];
const hasOut = it => isRing(it)||it==='chaosbox';

function openChaos(key){

const OUT_NAME = {r4:'리스트레인트 링 4레벨', c4:'컨티뉴어스 링 4레벨'};
const miniIcon = k => ITEM_ICONS[k] ? `<img class="ric" src="${ITEM_ICONS[k]}" alt="" aria-hidden="true">` : '';
const outIcon = o => o==='r4'?miniIcon('ring_restraint'):o==='c4'?miniIcon('ring_continuous'):o==='gl'?miniIcon('g_life'):'';
const xN = n => 'x'+n; // 개수 표기 공통: '리4 x1', '컨4 x3' (0개는 표시하지 않음)
function outTally(list, n){ const t={r4:0,c4:0,gl:0,x:0,un:0}; (list||[]).forEach(o=>{ if(o in t) t[o]++; }); t.un=Math.max(0,(+n||0)-(list||[]).length); return t; }
// 순서대로: '미기록 · 리4 · 꽝' / compact: '리4×2 · 꽝×3 · 미기록×1'
function outHtml(list, n, compact){
  list=list||[]; const t=outTally(list,n); const parts=[];
  if(compact){ for(const o of ['r4','c4','gl','x']) if(t[o]) parts.push(`<span class="ro ro-${o}">${outIcon(o)}${OUT_LABEL[o]} ${xN(t[o])}</span>`); }
  else { if(t.un) parts.push(`<span class="ro ro-un">미기록 ${xN(t.un)}</span>`); list.forEach(o=>parts.push(`<span class="ro ro-${o}">${outIcon(o)}${OUT_LABEL[o]}</span>`)); }
  if(compact&&t.un) parts.push(`<span class="ro ro-un">미기록 ${xN(t.un)}</span>`);
  return parts.length?`<span class="routs">${parts.join('<span class="rsep"> · </span>')}</span>`:'';
}
// 주간 기록: 주간 보스 결정석 수익 + 주간 보스 획득 아이템 (월간 보스는 monthSummary 로 따로)
function weekSummary(wid){
  const a=allRevenue();
  const perChar=a.per.map(p=>({id:p.c.id, name:p.c.name, job:p.c.job, world:p.c.world, meso:p.r.meso, count:p.r.wlist.length, bosses:p.r.wlist.map(bossTag), ...(sp=>({items:cleanItems(sp.items), outcomes:cleanOut(sp.outcomes)}))(charDrops(p.c,'weekly'))}));
  return {week:wid, weeklyOnly:true, total:a.total, cleared:a.per.reduce((s,p)=>s+p.r.wlist.length,0), crystals:a.count, items:perChar.reduce((s,p)=>s+itemSum(p.items),0), perChar};
}
function monthSummary(mid){
  const a=allRevenue();
  return {month:mid, total:a.monthTotal, cleared:a.per.reduce((s,p)=>s+p.r.mlist.length,0),
    perChar:a.per.filter(p=>p.r.mlist.length||itemSum(cleanItems(p.c.mdrops))).map(p=>({id:p.c.id, name:p.c.name, meso:p.r.monthMeso, bosses:p.r.mlist.map(bossTag), ...(sp=>({items:cleanItems(sp.items), outcomes:cleanOut(sp.outcomes)}))(charDrops(p.c,'monthly'))}))};
}
/* 획득 아이템 줄 (모든 화면 공통 형식): [아이콘] 아이템 이름 (N인 분배) ×개수 · 반지 상자는 결과 집계(리4·컨4·꽝·미기록)
 * byBoss: 보스별로 따로 (보스 이름 표시) / 기본: 아이템 + 인원별 합계 */

const dqIco = (it,cls='dqico') => DQ_ICONS[it.id]?`<img class="${cls}" src="${DQ_ICONS[it.id]}" alt="" width="20" height="20" decoding="async">`:'';
const DQ_TTL_MS = 10*60e3;      // 스케줄러 캐시 기본 수명 (길드 탭 등). 일퀘 탭은 자동 갱신 없음: 페이지 열 때 + 🔄 버튼
const GUILD_TTL_MS = 30*60e3;   // 길드 랭킹: 하루 1번(09:30경) 갱신 데이터라 30분 캐시
const MP_CHAR_DAILY = 7;        // 몬스터파크: 캐릭터당 하루 7회 (스케줄러 max_count 14 = 월드 기준)
const GUILD = {name:'봉사활동', world:'스카니아'}; // 고정값 (사용자 요청 시 변경)
const SCHED_KEY = 'mapleBossTracker.sched', GUILD_KEY = 'mapleBossTracker.guild';
const lsGet = k => { try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
let schedC = lsGet(SCHED_KEY) || {};   // charId → {date, level, items{id:{st,now,max,reg,name}}, guild{suro,flag,mission}, at, ok, msg}
let guildC = lsGet(GUILD_KEY);          // {date, t1, t2, at, ok, msg}
let dqBusy=false, guildBusy=false, dqEdit=false, apiPauseUntil=0;

function schedSummary(d){
  const daily=Array.isArray(d?.daily_contents)?d.daily_contents:[], weekly=Array.isArray(d?.weekly_contents)?d.weekly_contents:[];
  const nm=r=>normName(r?.content_name);
  const pick=r=>r?{st:String(r.quest_state??''),now:Number(r.now_count)||0,max:Number(r.max_count)||0,reg:flagOn(r.registration_flag),name:String(r.content_name||'')}:null;
  const items={};
  for(const it of DQ_ITEMS){
    let r=null;
    if(it.kind==='mp') r=daily.find(x=>nm(x)==='몬스터파크');
    else if(it.kind==='xmp') r=weekly.find(x=>nm(x).includes('익스트림몬스터파'))||daily.find(x=>nm(x).includes('익스트림몬스터파'));
    else r=daily.find(x=>nm(x).includes(normName(it.key)) && (x.type==='quest'||/일일/.test(x.content_name||'')));
    if(r) items[it.id]=pick(r);
  }
  const g=k=>{ const r=weekly.find(x=>nm(x).includes(k)); return r?{now:Number(r.now_count)||0,max:Number(r.max_count)||0}:null; };
  return {date:String(d?.date||'').slice(0,10)||dayId(), level:Number(d?.character_level)||0, items,
    guild:{suro:g('지하수로')} /* 2026-10-10: 플래그·주간 미션 표시 삭제 (같은 스케줄러 응답이라 API 호출 수는 그대로) */, at:Date.now(), ok:true, msg:''};
}
function schedPut(c,d){ schedC[c.id]=schedSummary(d); lsSet(SCHED_KEY,schedC); }
function schedErr(c,e){ schedC[c.id]={...(schedC[c.id]||{}),errAt:Date.now(),ok:false,msg:e.message,code:e.code||''}; lsSet(SCHED_KEY,schedC); }
/* 스케줄러 1회 호출 = 보스 자동 체크(applyScheduler) + 일퀘/길드 요약 저장 (동기화와 같은 경로) */
async function fetchSched(c,a){
  try{ const d=await nx('/maplestory/v1/scheduler/character-state',{ocid:c.ocid},a.key); schedPut(c,d); return d; }
  catch(e){ schedErr(c,e); throw e; }
}
const schedOk = c => !!(c.ocid && accOf(c)?.key);
const schedFresh = (c,ttl) => { const x=schedC[c.id]; const t=Math.max(x?.at||0,x?.errAt||0); return !!x && Date.now()-t<ttl && (!x.ok||x.date===dayId()); };
/* 열려 있는 탭에 필요한 캐릭터만, 오래된 것만(ttl) 순서대로 갱신. 동기화 중·호출량 초과 대기 중이면 건너뜀 */
async function refreshSched(chars, ttl=DQ_TTL_MS){
  if(dqBusy||syncing||Date.now()<apiPauseUntil) return;
  const todo=chars.filter(c=>schedOk(c)&&!schedFresh(c,ttl)); if(!todo.length) return;
  dqBusy=true; renderTabView(); let n=0;
  try{
    for(const c of todo){
      try{ n+=applyScheduler(c, await fetchSched(c,accOf(c))); }
      catch(e){ if(e.code==='OPENAPI00007'||e.status===429){ apiPauseUntil=Date.now()+DQ_TTL_MS; break; } if(e.code==='NETWORK') break; }
      renderTabView();
    }
    save();
    if(n) toast(`스케줄러 갱신 — 새로 체크된 보스 ${n}개`);
  } finally { dqBusy=false; renderChars(); renderTabView(); }
}
/* 길드 랭킹: 오늘 날짜(09:30 KST 이후) → 비었거나 준비 전이면 어제 */
async function refreshGuild(force){
  if(guildBusy||Date.now()<apiPauseUntil) return; const key=anyKey(); if(!key) return;
  const ttl=guildC?.ok&&guildC.date===dayId()?3*GUILD_TTL_MS:GUILD_TTL_MS;
  if(!force && guildC && Date.now()-(guildC.at||0)<ttl) return;
  guildBusy=true; renderTabView();
  const k=kst(), ready=k.getUTCHours()*60+k.getUTCMinutes()>=9*60+30;
  const days=(ready?[dayId()]:[]).concat(dayId(Date.now()-864e5));
  let got=null, lastErr=null;
  try{
    for(const d of days){
      const rows={};
      try{
        for(const t of [2,1]){
          const r=await nx('/maplestory/v1/ranking/guild',{date:d,world_name:GUILD.world,ranking_type:t,guild_name:GUILD.name},key);
          rows[t]=(Array.isArray(r?.ranking)?r.ranking:[]).find(x=>x&&x.guild_name===GUILD.name&&(!x.world_name||x.world_name===GUILD.world))||null;
        }
      }catch(e){ lastErr=e; if(e.code==='OPENAPI00007'||e.status===429||e.code==='NETWORK') break; continue; }
      if(rows[1]||rows[2]){ got={date:d,t1:rows[1],t2:rows[2]}; break; }
    }
    if(got) guildC={...got,at:Date.now(),ok:true,msg:''};
    else guildC={...(guildC||{}),at:Date.now(),ok:false,msg:lastErr?lastErr.message:`'${GUILD.world}' 월드 랭킹에서 '${GUILD.name}' 길드를 찾지 못했습니다`};
    lsSet(GUILD_KEY,guildC);
  } finally { guildBusy=false; renderTabView(); }
}
/* 60초 타이머·탭 열기·화면 복귀 시 호출: 열려 있는 탭만 갱신 */
function tabTick(){
  if(document.hidden) return;
  // 일퀘 탭: 자동 갱신 없음 (2026-10-10) — 페이지 열 때 동기화(syncAll, 3초 규칙)가 같은 스케줄러 응답을 저장 + 🔄 버튼
  if(tab==='guild'){ refreshGuild(); refreshSched(S.characters.filter(c=>c.isMain)); }
}
function renderTabView(){ if(tab==='daily') renderDaily(); else if(tab==='guild') renderGuild(); }
const hhmm = t => { const d=kst(t); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const dqChars = () => orderedChars().filter(schedOk);
/* 항목 상태: lock(레벨 미달) · none(스케줄러에 없음) · done · prog · idle */
function dqState(it, x, lv){
  if(it.lv && lv && lv<it.lv) return 'lock';
  if(!x) return 'none';
  if(it.kind==='mp') return x.now>=Math.min(MP_CHAR_DAILY, x.max||MP_CHAR_DAILY)?'done':x.now>0?'prog':'idle';

const DQ_TXT = {done:'완료', prog:'진행 중', idle:'미수락', none:'정보 없음'};
function dqCell(c, it, x, st, off){
  // 몬스터파크: 캐릭터당 하루 7회 기준(n/7회) · 익스트림 몬파: 주간 퀘스트(주간 n/5) · 진행 중 퀘스트에 카운트가 있으면 '진행 n/m'
  let txt=DQ_TXT[st], cnt='';
  if(x && it.kind==='mp'){ txt=st==='done'?'완료':''; cnt=`${Math.min(x.now,MP_CHAR_DAILY)}/${MP_CHAR_DAILY}회`; }
  else if(x && it.kind==='xmp'){ txt=st==='done'?'완료':'주간'; cnt=x.max>0?`${x.now}/${x.max}`:''; }
  else if(x && st==='prog' && x.max>0){ txt='진행'; cnt=`${x.now}/${x.max}`; }
  const tip = (x?.name||it.label)+(it.weekly?' (주간)':'')+(it.kind==='mp'?` · 오늘 ${x?.now??0}회 (캐릭터당 하루 ${MP_CHAR_DAILY}회, 스케줄러 최대 ${x?.max??'-'})`:'')+(dqEdit?'\n클릭: 이 캐릭터에서 '+(off?'다시 표시':'숨기기'):'');
  return `<div class="dqi s-${st}${off?' off':''}" style="--c:${it.col}" data-dqi="${it.id}" ${dqEdit?`data-dqc="${c.id}|${it.id}" role="button" tabindex="0"`:''} title="${esc(tip)}">

/* ---------- 사용자 지정 순서 ----------
 * S.characters 배열 순서 = 월드 그룹 안에서의 표시 순서, S.worldOrder = 월드 그룹 순서.
 * 동기화·가져오기·본캐 지정은 이 순서를 바꾸지 않습니다(새 캐릭터는 맨 뒤에 추가). */
function worldGroups(){
  const groups=new Map();
  for(const w of S.worldOrder) groups.set(w,[]);
  for(const c of S.characters){ const w=worldOf(c); if(!groups.has(w)) groups.set(w,[]); groups.get(w).push(c); }
  for(const [w,cs] of groups) if(!cs.length) groups.delete(w);
  return groups;
}
const orderedChars = () => [...worldGroups().values()].flat();
function moveCharTo(id, targetId, after){
  if(id===targetId) return false;
  const arr=S.characters, c=arr.find(x=>x.id===id), t=arr.find(x=>x.id===targetId);
  if(!c||!t||worldOf(c)!==worldOf(t)) return false;
  arr.splice(arr.indexOf(c),1); arr.splice(arr.indexOf(t)+(after?1:0),0,c);
  save(); return true;
}
function moveCharBy(id, dir){
  const c=S.characters.find(x=>x.id===id); if(!c) return;
  const same=S.characters.filter(x=>worldOf(x)===worldOf(c)); const i=same.indexOf(c), j=i+dir;
  if(j<0||j>=same.length) return;
  moveCharTo(id, same[j].id, dir>0);
}
function moveWorldTo(w, target, after){
  if(w===target) return false;
  const order=[...worldGroups().keys()]; if(!order.includes(w)||!order.includes(target)) return false;
  order.splice(order.indexOf(w),1); order.splice(order.indexOf(target)+(after?1:0),0,w);
  S.worldOrder=order; save(); return true;
}
function moveWorldBy(w, dir){ const order=[...worldGroups().keys()], j=order.indexOf(w)+dir; if(j<0||j>=order.length) return; moveWorldTo(w, order[j], dir>0); }

function expLine(c){
  const e=c.exp; if(!e||!isFinite(e.rate)) return '';
  if(e.level&&c.level&&+e.level!==+c.level) return '';
  const p=Math.max(0,Math.min(100,+e.rate));

  return `<div class="expl" title="${esc(tip)}"><span class="expbar" role="progressbar" aria-label="경험치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p.toFixed(2)}"><i style="width:${p.toFixed(2)}%"></i></span><span class="exppct">${p.toFixed(2)}%</span></div>`;
}

const CHAR_ROWS=8, CHAR_ROWS_MIN=4, SIDE_FEED_MIN=31*2+70+12; // 소식 카드 최소 높이(feedFit 의 minH) + 카드 간격

const WORLD_TAB_KEY='mapleBossTracker.worldTab';

  const act=activeChar();
  if(seenActive===null) seenActive=S.activeId;

/* 총 수익: 시작 주(S.startWeek)부터 저장된 모든 주간 기록 + 이번 주, 월간 보스는 별도 합계. 기록은 자동 삭제되지 않음 */
function totalData(){
  const weeks=[...S.history.slice().sort((a,b)=>a.week<b.week?-1:1).map(h=>({...h,cur:false})),{...weekSummary(S.period.week),cur:true}];

  const add=(p,f)=>{ const k=keyOf(p); const o=chars[k]||(chars[k]={name:nameOf(p),week:0,month:0,items:{},outs:{},weeks:0}); f(o);

      if(hasOut(it)){ const l=(p.outcomes||{})[ik]||[]; I.outs.push(...l); (o.outs[a]=o.outs[a]||[]).push(...l); if(isRing(it)){ const t=outTally(l,n); for(const q in ring) ring[q]+=t[q]; } } } };
  // 보스(난이도)별 아이템: 난이도는 그 주 기록의 보스 태그 '이름(난이도)' → 없으면 현재 캐릭터 설정
  const byBoss={};

    const cc=p.id&&S.characters.find(x=>x.id===p.id);
    for(const [ik,n] of Object.entries(p.items||{})){ const {slot,it}=parseIK(ik); const b=findBoss(slot); if(!b||!ITEMS[it]||!(+n>0)) continue;
      const dl=tags[b.name]||(cc&&cc.bosses[slot]?.diff?D[cc.bosses[slot].diff]:'');
      const bk=slot+'|'+dl, o=byBoss[bk]||(byBoss[bk]={slot,dl,items:{}}); let u=+n;
      if(isRing(it)) ((p.outcomes||{})[ik]||[]).forEach(q=>{ if(q==='gl') o.items.g_life=(o.items.g_life||0)+1; });
      if(it==='chaosbox') ((p.outcomes||{})[ik]||[]).forEach(q=>{ if(/^cb:/.test(q)&&ITEMS[q.slice(3)]&&u>0){ o.items[q]=(o.items[q]||0)+1; u--; } });

  return {weeks,months,wTotal,mTotal,grand:wTotal+mTotal,ring,byBoss,chars:Object.values(chars).sort((a,b)=>(b.week+b.month)-(a.week+a.month)),items:Object.entries(items).sort((a,b)=>b[1].n-a[1].n)};

/* 캐릭터 추가 모달의 '이 계정 캐릭터에서 선택' 목록 */
let pickSeq=0;
async function loadPick(force){
  const wrap=$('#fPickWrap'), box=$('#fPick'), a=accById($('#fAcc').value);
  if(editingId||!a||!a.key){ wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden'); $('#fPickAcc').textContent=a.label;
  const cached=listCache[a.id];
  if(cached && !force && cached.key===a.key && Date.now()-cached.at<10*60e3){ renderPick(); return; }
  const seq=++pickSeq; box.innerHTML='<div class="muted" style="padding:8px"><span class="spin"></span> 캐릭터 목록을 불러오는 중…</div>';
  try{ const all=await listAccount(a); assignFromList(a,all); save(); if(seq===pickSeq) renderPick(); }
  catch(e){ a.status={ok:false,msg:e.message,at:Date.now()}; save(); if(seq===pickSeq) box.innerHTML=`<div class="impmsg err">${errHtml(e,a)}<button class="btn sm plain" id="fPickRetry">다시 불러오기</button></div>`; }
}
function renderPick(){
  const a=accById($('#fAcc').value), box=$('#fPick'), cached=a&&listCache[a.id]; if(!cached||cached.key!==a.key) return;
  if(!cached.all.length){ box.innerHTML=`<div class="impmsg warn">${emptyHtml(a)}<button class="btn sm plain" id="fPickRetry">다시 불러오기</button></div>`; return; }
  const typed=$('#fName').value.trim(), q=(lookup?.ocid&&lookup.name===typed)?'':normName(typed);
  const have=new Set(S.characters.map(c=>c.ocid).filter(Boolean)), haveName=new Set(S.characters.map(c=>c.name));
  const list=cached.all.filter(x=>!q||normName(x.character_name).includes(q)).sort((x,y)=>y.character_level-x.character_level||x.character_name.localeCompare(y.character_name));
  box.innerHTML=list.length?list.map(x=>{const dup=(x.ocid&&have.has(x.ocid))||haveName.has(x.character_name), on=lookup?.ocid&&lookup.ocid===x.ocid;
    return `<button type="button" class="pick-item ${on?'on':''}" data-pick="${esc(x.ocid)}" ${dup?'disabled':''}><b>${esc(x.character_name)}</b><span class="muted">Lv.${x.character_level} · ${esc(x.character_class)} · ${esc(x.world_name)}${dup?' · 추가됨':''}</span></button>`;}).join('')
    :`<div class="muted" style="padding:8px">'${esc(typed)}'와(과) 일치하는 캐릭터가 이 계정에 없습니다 (전체 ${cached.all.length}명).</div>`;
}
async function pickChar(ocid){
  const a=accById($('#fAcc').value), x=listCache[a?.id]?.all.find(y=>y.ocid===ocid); if(!x) return;

function closeCharModal(){ $('#charModal').classList.remove('show'); }
async function lookupByName(){
  const name=$('#fName').value.trim(); if(!name){toast('이름을 입력하세요');return;}
  const msg=$('#fLookupMsg'); msg.innerHTML='<span class="spin"></span> 조회 중…';
  try{
    const key=accById($('#fAcc').value)?.key||anyKey();
    const {ocid}=await nx('/maplestory/v1/id',{character_name:name},key);
    const b=await nx('/maplestory/v1/character/basic',{ocid},key);
    lookup={ocid,name:b.character_name||name,image:b.character_image,exp:expFrom(b)};
    $('#fName').value=b.character_name||name; $('#fJob').value=b.character_class||''; $('#fLevel').value=b.character_level||''; $('#fWorld').value=b.world_name||'';
    $('#fAvatar').outerHTML=avatar({name,image:b.character_image},'lg').replace('class="avatar lg"','class="avatar lg" id="fAvatar"');
    msg.textContent='✓ 불러왔습니다. (기본 정보는 게임 데이터 반영까지 평균 15분 지연될 수 있음)';
  }catch(e){ msg.textContent='조회 실패: '+e.message; }
}
function saveChar(){
  const name=$('#fName').value.trim(); if(!name){toast('이름을 입력하세요');return;}
  const job=$('#fJob').value.trim(), world=$('#fWorld').value.trim(); const level=Math.max(1,Math.min(300,parseInt($('#fLevel').value)||0))||'';
  const isMain=$('#fMain').checked, accId=$('#fAcc').value||'';
  let c;
  if(editingId){ c=S.characters.find(x=>x.id===editingId); if(c.name!==name && !lookup){ c.ocid=''; c.image=''; delete c.exp; } Object.assign(c,{name,job,level,world}); toast('수정되었습니다'); }
  else{
    c={id:uid(),name,job,level,world,bosses:{},weekly:{},monthly:{},auto:{},sync:{}};
    S.characters.push(c); S.activeId=c.id; tab='boss'; editMode=false; bossFilter='weekly';
    toast('캐릭터 추가! 도는 보스를 선택하세요');
  }
  if(lookup){ c.ocid=lookup.ocid; c.image=lookup.image||''; c.sync={...c.sync,imgAt:Date.now()}; if(lookup.exp) c.exp=lookup.exp; }
  if((c.accId||'')!==accId){ c.accId=accId||undefined; c.sync={...c.sync,ok:undefined,msg:'',at:0}; }
  setMain(c,isMain);
  save(); closeCharModal(); syncTabs(); render();
}
function setMain(c,on){ if(on) S.characters.forEach(x=>x.isMain=(x===c)); else c.isMain=false; }
function deleteChar(){
  const c=S.characters.find(x=>x.id===editingId); if(!c) return;
  if(!confirm(`'${c.name}' 캐릭터를 삭제할까요?`)) return;
  S.characters=S.characters.filter(x=>x.id!==editingId);
  if(S.activeId===editingId) S.activeId=S.characters[0]?.id||null;
  save(); closeCharModal(); render(); toast('삭제되었습니다');
}

 *  - 마지막으로 받은 prices.json 은 이 브라우저에 보관 (다음 접속 때 바로 적용, 드라이브에는 넣지 않음)

const PRICES_CACHE_KEY='mapleBossTracker.officialPrices';
let officialInfo=null; // {checkedAt, source:{url,title,date}, applied, pending:[{key,effective,price}]}
function parseBossLabel(label){
  const m=/^(.*?)\s*[(（]\s*(.+?)\s*[)）]\s*$/.exec(String(label||'').trim()); if(!m) return null;
  const b=matchBoss(m[1]), d=normDiff(m[2]); if(!b||!d||!b.diffs.includes(d)) return null;
  return {b,d};
}
// 테섭 예정 가격으로 잠깐 바꿔 계산 (예정 가격이 없으면 null)
function withUpcoming(fn){ const up=officialInfo&&officialInfo.upcoming; if(!up||!Object.keys(up).length) return null; const keep={};
  for(const k in up){ keep[k]=PRICE_CONFIG[k]; PRICE_CONFIG[k]=up[k]; } try{ return fn(); } finally{ for(const k in keep) PRICE_CONFIG[k]=keep[k]; } }
function applyOfficialPrices(pj){
  if(!pj||!Array.isArray(pj.rows)) return false;
  const today=dayId(); let changed=false, applied=0; const pending=[];
  for(const r of pj.rows){ const m=parseBossLabel(r.boss); const v=Math.round(+r.new); if(!m||!(v>0)) continue;
    const k=priceKey(m.b,m.d);
    if(r.effective && r.effective>today){ pending.push({key:k,effective:r.effective,price:v}); continue; } // 적용일 전에는 기존 값 유지
    if(PRICE_CONFIG[k]!==v){ PRICE_CONFIG[k]=v; changed=true; } applied++;
  }
  // 테섭 예정 가격 (pj.upcoming): 실서버 가격은 그대로, 다른 값만 '테섭 예정 → N' 표시
  const upcoming={}; for(const r of (pj.upcoming&&pj.upcoming.rows)||[]){ const m=parseBossLabel(r.boss); const v=Math.round(+r.new); if(m&&v>0){ const k=priceKey(m.b,m.d); if(PRICE_CONFIG[k]!==v) upcoming[k]=v; } }
  officialInfo={checkedAt:pj.checkedAt||'', source:pj.source||{}, applied, pending, upcoming, upSource:(pj.upcoming&&pj.upcoming.source)||null};
  return changed;
}
/* 최고 전투력: 동기화 서버(Worker, server/cp.js)가 넥슨 Open API 로 프리셋 조합(장비×하이퍼×어빌리티×링크) 최대값을 계산해 D1 에 저장.
 * 사이트: 로그인(동기화 모드)일 때 GET /api/cp 로 읽고, 캐릭터 동기화가 끝나면 오늘(KST) 아직 계산 안 한 캐릭터만 POST /api/cp (캐릭터당 하루 1번, 서버도 같은 제한). */
let cpData={}; const CP_CACHE='mapleBossTracker.cp';
try{ cpData=JSON.parse(localStorage.getItem(CP_CACHE)||'{}')||{}; }catch(e){}
const kstDay = t => new Date(+t+9*3600e3).toISOString().slice(0,10);
async function cpLoad(){ if(!SV_ON||!svTok()) return; try{ const r=await svFetch('/api/cp'); cpData=r.items||{}; localStorage.setItem(CP_CACHE,JSON.stringify(cpData)); if(tab==='boss') render(); }catch(e){} }
let cpBusy=false;
async function cpRefresh(){ if(cpBusy||!SV_ON||!svTok()) return; cpBusy=true; const today=kstDay(Date.now());
  try{ for(const c of S.characters){ const a=accOf(c); if(!c.ocid||!a?.key) continue; const x=cpData[c.ocid]; if(x&&kstDay(x.at)===today) continue;
      try{ const r=await svFetch('/api/cp',{method:'POST',body:{ocid:c.ocid,name:c.name,key:a.key}}); cpData[c.ocid]=r; localStorage.setItem(CP_CACHE,JSON.stringify(cpData)); if(tab==='boss'&&S.activeId===c.id) render(); }
      catch(e){ if(e.status===429||e.type==='network'||e.type==='interaction_required') break; } } }
  finally{ cpBusy=false; } }
const CP_NAMES={equip:'장비',hyper:'하이퍼',ability:'어빌',link:'링크'};
function cpStat(c){ const x=c.ocid&&cpData[c.ocid]; const v=x&&+x.value>0?+x.value:null;
  const combo=v?Object.entries(CP_NAMES).filter(([k])=>x.combo&&x.combo[k]).map(([k,n])=>`${n} ${x.combo[k]}`).join(' · '):'';
  const at=v&&x.at?(d=>`${d.toISOString().slice(0,10)} ${d.toISOString().slice(11,16)} 갱신`)(new Date(+x.at+9*3600e3)):'';
  const tip=v?`최고 전투력 (추정) — 프리셋 조합 중 최대
현재 프리셋 전투력(넥슨 API): ${x.apiCP?Number(x.apiCP).toLocaleString():'-'}
${combo}`:'동기화 서버 로그인 후 캐릭터 동기화 때 계산 (하루 1번)';
  return `<div class="stat cpstat" title="${esc(tip)}"><div class="k">최고 전투력</div><div class="v acc">${v===null?'—':meso(v)}</div>${v?`<div class="cpsub muted">${esc(combo)}</div><div class="cpsub muted">${esc(at)}</div>`:''}</div>`; }
function loadOfficialPrices(){
  try{ const c=JSON.parse(localStorage.getItem(PRICES_CACHE_KEY)||'null'); if(c) applyOfficialPrices(c); }catch(e){}
  if(!/^https?:$/.test(location.protocol)) return; // 파일로 연 경우: 내장 기본값 사용
  fetch(`./prices.json?d=${dayId()}`,{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(pj=>{
    if(!pj||!Array.isArray(pj.rows)||!pj.rows.length) return;

}

/* =====================================================================

 *   - 옮기기: 처음 로그인 때 서버가 비어 있으면 이 PC 데이터를 올림 / '구글 드라이브에서 가져오기' 버튼(한 번, 클릭 시 구글 로그인)
 * ===================================================================== */
const SYNC_HOSTS = ['bossmaple.pages.dev']; // 이 주소로 열면 서버 동기화가 기본 (입장 화면 바로 표시). github.io 는 아직 구글 드라이브
const SYNC_API_URL = SYNC_HOSTS.includes(location.hostname) ? 'https://ggoolzip-sync.bossmaple.workers.dev' : ''; // 비우면 구글 드라이브
const SYNC_TEST_URL = 'https://ggoolzip-sync.bossmaple.workers.dev'; // 배포한 서버 주소 — 주소 뒤에 ?sync=test 를 붙여 열면 이 브라우저만 서버 모드로 미리 써 보기, ?sync=off 로 되돌림
const SV_ON = (()=>{ let u=SYNC_API_URL;

const SV_TOKEN_KEY='mapleBossTracker.svToken', SV_DEVICE_KEY='mapleBossTracker.svDevice', SV_SUBSIG_KEY='mapleBossTracker.svSubSig', SV_USER_KEY='mapleBossTracker.svUser'; // svUser = 이 기기에서 마지막으로 로그인한 서버 사용자 (다른 사용자로 로그인하면 이 PC 데이터를 올리지 않고 비움) // svDevice = 초대 비밀번호를 통과한 기기 표 (로그아웃해도 유지)

async function svFetch(path,opt={}){
  const tok=svTok(); if(!tok&&!opt.noAuth) throw Object.assign(new Error(SV_NEED_LOGIN),{type:'interaction_required'});

  catch(e){ throw Object.assign(new Error('동기화 서버에 연결하지 못했습니다 (인터넷 연결 확인)'),{type:'network'}); }
  let b=null; try{ b=await r.json(); }catch(e){}

/* ---- 동기화 비교·병합 (2026-10-10) ----

 *   캐릭터·계정은 id, 주간/월간 기록은 week/month 로 짝지음. 한쪽 삭제 + 다른 쪽 수정 → 수정본 유지(데이터 안 잃음).
 *   API 로 다시 받는 값(레벨·직업·월드·ocid·계정 배정)과 지난 기록 요약은 충돌이어도 묻지 않음(이 PC 값 / 클리어 많은 쪽). */
const GD_BASE_KEY=SV_ON?'mapleBossTracker.svbase':'mapleBossTracker.gdbase';
const GD_LOCAL_RE=/^(theme|activeId|period|updatedAt|version|startWeek)$|^settings\.(lastSync|autoSync|apiKey|driveKeys|apiMode|prices|priceSource|worldLimit)$|^characters\[[^\]]*\]\.(sync|image|exp)$|^settings\.accounts\[[^\]]*\]\.(key|status)$/;

function gdMerge(b,l,r,ctx,p=''){

const GD_RES_MSG={same:'',pushed:SV_ON?'이 PC의 변경 사항을 서버에 저장했습니다':'이 PC의 변경 사항을 드라이브에 저장했습니다',pulled:'다른 기기에서 바뀐 데이터를 불러왔습니다',merged:'다른 기기의 변경과 자동으로 합쳤습니다',loaded:SV_ON?'서버 데이터를 불러왔습니다':'드라이브 데이터를 불러왔습니다'};

 *  - 예전 버전 메타(시각만 있음): 한쪽만 바뀌었으면 그쪽, 둘 다면 묻지 않고 합침(겹치는 값은 최근 수정한 쪽)

async function gdSync(remote){
  if(!remote?.data || !Array.isArray(remote.data.characters)) throw new Error('드라이브 파일 형식이 올바르지 않습니다');

  if(!bd&&gdMeta.base){ if(rU===gdMeta.base) bd=rd; else if(lU===gdMeta.base) bd=ld; }

  if(!bd&&!legacy&&gdSig(rd)!==gdSig(ld)) return gdAsk(remote,{mode:'whole'});

  const m=gdMerge(bd,ld,rd,ctx);

// 병합 결과 m 을 이 PC 에 적용(달라졌으면)하고 드라이브에 저장(달라졌으면)
