</head>
<body>
<header>
  <div class="hwrap">
    <a class="logo" id="logoHome" href="#" title="이번 주 보스" aria-label="메보수 — 이번 주 보스 탭으로">
      <img class="leaf mush" src="__LOGO64__" alt="" width="30" height="30">
      메보수
    </a>
    <div class="hspace"></div>
    <div class="gwrap"><button class="hbtn gbtn" id="gBtn" aria-haspopup="true" aria-expanded="false">☁ 구글 로그인</button>
      <div class="gmenu" id="gMenu" hidden role="dialog" aria-label="구글 드라이브 동기화"></div></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="boss" class="on">이번 주 보스</button>
    <button data-tab="total">수익 분석</button>
    <button data-tab="loot">득템 분석</button>
    <span class="tabsep" aria-hidden="true"></span>
    <button data-tab="daily">일퀘 현황</button>
    <button data-tab="guild">길드 현황</button>
  </nav>
</header>

<main>
  <aside class="side-sticky">
    <div class="card">
      <h2 class="charh">캐릭터 <button class="ibtn sbtn" id="syncBtn" type="button" hidden aria-label="지금 동기화" title="지금 동기화"></button><span class="hspace"></span><button class="btn sm" id="addCharBtn">+ 추가</button></h2>
      <div class="wtabs" id="worldTabs"></div>
      <div class="chars" id="charList"></div>
    </div>
    <div class="card feedcard" id="feedCard" style="margin-top:12px"></div>
    <div class="card feedcard suncard" id="sunCard" style="margin-top:12px"></div>
  </aside>
  <section id="view"></section>
</main>
<div class="foot">Data based on NEXON Open API.</div>

<div class="modal-bg" id="charModal">
  <div class="modal">
    <h3 id="charModalTitle">캐릭터 추가</h3>
    <div class="field hidden" id="fPickWrap"><label>이 계정 캐릭터에서 선택 · <span id="fPickAcc"></span> <button type="button" class="linkbtn" id="fPickReload">새로고침</button></label>
      <div class="pick-list" id="fPick"></div></div>
    <div class="field"><label>캐릭터 이름</label>
      <div class="keyrow"><input type="text" id="fName" maxlength="20" placeholder="예: 단풍잎용사"><button class="btn sm plain" id="fLookup" title="넥슨 Open API로 직업·레벨·월드·이미지 불러오기">API 조회</button></div>
      <div class="muted" id="fLookupMsg" style="margin-top:4px"></div></div>
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div class="avatar lg" id="fAvatar">?</div>
      <div style="flex:1">
        <div class="field"><label>직업</label><input type="text" id="fJob" list="jobList" maxlength="20" placeholder="예: 아크메이지(불,독)"></div>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <div class="field" style="flex:1"><label>레벨</label><input type="number" id="fLevel" min="1" max="300" placeholder="예: 270"></div>
      <div class="field" style="flex:1"><label>월드</label><input type="text" id="fWorld" list="worldList" maxlength="12" placeholder="예: 스카니아"></div>
    </div>
    <div class="field"><label>넥슨 계정 (API 자동 체크에 사용할 키)</label><select class="in" id="fAcc"></select></div>
    <label class="checkline"><input type="checkbox" id="fMain"> 본캐로 지정 (★)</label>
    <div class="row">
      <button class="btn danger hidden" id="fDelete">삭제</button>
      <span style="flex:1"></span>
      <button class="btn plain" id="fCancel">취소</button>
      <button class="btn" id="fSave">저장</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="importModal">
  <div class="modal wide addm" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <button class="ringx" id="impClose" aria-label="닫기">✕</button>
    <h3 id="addTitle">캐릭터 추가</h3>
    <section class="addsec">
      <div class="addsec-h"><b>🔑 넥슨 API 키</b> <span id="accKeyTotal" class="regok keycnt" hidden></span></div>
      <div id="accList"></div>
      <div class="accadd" id="accAddRow" hidden><input id="newAccLabel" class="pin" maxlength="12" placeholder="계정 이름" aria-label="계정 이름">
        <input id="newAccKey" class="pin" type="password" autocomplete="off" spellcheck="false" placeholder="API키 입력" aria-label="API 키">
        <button class="btn sm" id="newAccBtn">등록</button><button class="btn sm plain" id="accAddCancel" title="이 줄 지우기">취소</button></div>
      <button class="btn sm ghost accaddopen" id="accAddOpen">+ 계정 추가</button>
      <div class="optlines compact" id="accOpts"></div>
    </section>
    <section class="addsec" id="impSec">
      <span id="impTitle" hidden></span><span id="impCount" hidden></span>
      <div class="impmsg" id="impMsg"></div>
      <div class="toolbar" id="impTools"><input type="search" id="impQ" class="pin" placeholder="이름·직업 검색" style="width:130px;text-align:left"><span class="muted">최소 레벨</span><input type="number" id="impMin" value="" min="0" placeholder="전체" style="width:70px" class="pin"><select id="impWorld" class="btn sm ghost impworld"></select><button class="btn sm" id="impOk">캐릭터 추가</button><span style="flex:1"></span><button class="btn sm plain" id="impAll">전체 선택</button></div>
      <div class="imp-list" id="impList"></div>
      <div class="row"><span class="muted tiny" style="flex:1">처음 추가하면 레벨이 가장 높은 캐릭터가 본캐(★)가 됩니다. 추가 후 이미지·보스 클리어를 자동 동기화합니다.</span></div>
    </section>
  </div>
</div>

<div class="modal-bg" id="ringModal">
  <div class="modal ringm" role="dialog" aria-modal="true" aria-labelledby="ringTitle">
    <button class="ringx" id="ringClose" aria-label="닫기 (기록 안 함)" title="닫기 (기록 안 함)">✕</button>
    <div class="ringhead"><span id="ringBoxIcon" class="ringbox"></span><div><h3 id="ringTitle">반지 상자 획득!</h3><div class="muted" id="ringSub"></div></div></div>
    <div class="ringchoices">
      <button class="ringc r4" data-ring="r4"><span class="ringico" id="ricR"></span><b>리스트레인트 링 4레벨을 먹었어요</b></button>
      <button class="ringc c4" data-ring="c4"><span class="ringico" id="ricC"></span><b>컨티뉴어스 링 4레벨을 먹었어요</b></button>
      <button class="ringc gl" data-ring="gl" hidden><span class="ringico" id="ricG"></span><b>생명의 연마석을 먹었어요</b></button>
      <button class="ringc x" data-ring="x"><span class="ringico ricx">✕</span><b>둘 다 못 먹었어요</b></button>
    </div>
    <div class="muted" style="font-size:.75rem;margin-top:8px">✕ · Esc · 바깥을 누르면 아무것도 기록하지 않고 닫습니다.</div>
  </div>
</div>
<div class="modal-bg" id="driveModal">
  <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="gdTitle">
    <button class="ringx" id="gdClose" aria-label="나중에">✕</button>
    <h3 id="gdTitle">☁️ 어느 데이터를 쓸까요?</h3>
    <div id="gdBody"></div>
  </div>
</div>
<div class="modal-bg" id="adminModal">
  <div class="modal wide admm" role="dialog" aria-modal="true" aria-labelledby="admTitle">
    <button class="ringx" id="admClose" aria-label="닫기">✕</button>
    <h3 id="admTitle">👑 관리자 — 가입 승인</h3>
    <div id="admBody"></div>
  </div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="congrats" role="status" aria-live="polite"></div>

<datalist id="jobList"></datalist>
<datalist id="worldList"></datalist>
<div class="toast" id="toast"></div>
