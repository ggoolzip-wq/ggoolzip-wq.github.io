name: Update feed

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect feed
        id: feed
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          NEXON_API_KEY2: ${{ secrets.NEXON_API_KEY2 }}
          FEED_ALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python3 scripts/update_feed.py
      - name: Commit if changed
        if: steps.feed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet && exit 0
          git commit -m "feed: update $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main || { git rebase --abort; sleep 3; continue; }
            git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
